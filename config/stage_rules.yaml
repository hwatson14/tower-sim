version: 0.1
stages:
  account_state:
    description: Permanent/account-owned state parsed from IDS.csv.
  loadout_resolved:
    description: Active preset/equipped selections resolved from IDS.csv.
  stat_inputs:
    description: Normalized contributor rows emitted for stat resolution.
  final_stats:
    description: Aggregated stat outputs from stat_engine.
default_stage: final_stats
notes:
  - IDS.csv is treated as the source of truth for active loadout where present.
  - Runtime-only battle effects are out of scope for this package version.

presentation:
  display_number_policy:
    scope: rendered_and_exported_display_fields_only
    raw_value_policy: preserve_full_precision_raw_numeric_values
    abbreviations: [k, M, B, T, q, Q, s, S]
    percent_policy: pct and percent_display surfaces render with a trailing percent sign
    multiplier_policy: multiplier and multiplier_display surfaces render with a leading x

execution_states:
  account_baseline:
    description: Permanent account-owned systems only. Excludes workshop, bots, cards, and modules.
  gem_respec:
    description: Account baseline plus gem-respeccable systems. Includes workshop and bots; excludes cards and modules.
  start_of_run:
    description: Gem respec state plus active loadout for the selected preset.
  max_progression:
    description: Start-of-run state with workshop projected to max_level. Perks may be supplied explicitly via input/perks.json or --perks.
