version: 1
node_kinds:
  source_input:
    description: Direct mutable or account-derived inputs that can trigger dependency invalidation.
  canonical_stat:
    description: Publishable canonical stats resolved by the stat engine.
  runtime_surface:
    description: Downstream runtime consumer surfaces owned outside the stat engine.
policies:
  truth_source: engine.stat_engine
  fallback_mode: full_safe_recompute
  partial_execution_policy: closed_subset_only
