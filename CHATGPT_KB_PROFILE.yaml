profile_name: tower_kb_calculator_baseline
package_role: >-
  Combined Tower knowledge-base, calculator, perk-timeline, progression-foundation,
  and downstream optimizer support package for AI-assisted merge, audit, and simulator work.
primary_use_cases:
  - knowledge retrieval
  - calculator verification
  - merge planning
  - progression engine integration
  - downstream optimizer consumption
entry_surfaces:
  - START_HERE_FOR_AI.md
  - manifest.json
  - readme.md
  - MASTER_SURFACE_TRUST_LEDGER.csv
  - SURFACE_PRIORITY_REGISTRY.csv
  - UNKNOWNS_OPERATING_POLICY.csv
  - MERGE_NOTES_FOR_AI.md
  - docs/15_engine_readiness_audit.md
  - docs/16_progression_engine_scope_and_burndown.md
  - kb/index.md
canonical_rebuild:
  command: python run_stats.py
canonical_outputs:
  path: out/
truth_order:
  - canonical tables and contracts
  - governed emitted surfaces
  - package canon decisions and ledgers
  - explicit override contracts
  - advisory and community layers
hard_boundaries:
  - Do not upgrade accepted model constants to stronger truth without KB/package evidence.
  - Do not represent open scenario-runtime items as closed.
  - Do not let advisory/community sources override canonical mechanics.
