eDamage_mechanics:
  version: ep_v5.00.01_extract_2026-02-02
  workbook: Copy of Effective Paths v5.00.01.xlsx
  mechanics:
  - id: ep_lambda_bullet_per_second
    name: BULLET_PER_SECOND
    type: excel_named_formula
    excel_definition: LAMBDA(attack_speed, ((0.01413 * attack_speed^2) + (4.01278 * attack_speed) + 92.8885)*1.3)
    notes: From workbook defined name.
  - id: ep_lambda_epd_aspd
    name: EPD_ASPD
    type: excel_named_formula
    excel_definition: "LAMBDA(ws_level, wsp_level, lab_level, has_card, card_level, substat, relic, vault, has_mastery, mastery_level,\
      \ LET(\n  WS, 1 + 0.05 * ws_level,\n  WSPlus, 1 + 0.01 * wsp_level,\n  Lab, 1 + 0.02 * lab_level,\n  CardASPD, IF(has_card,\
      \ (1.1 + card_level * 0.15) * IF(has_mastery, 1+0.03*(1+mastery_level), 1), 1),\n  RelicBonus, 1 + relic,\n  VaultBonus,\
      \ 1 + vault,\n\n(WS * Lab * CardASPD + Substat) * WSPlus * RelicBonus * VaultBonus))"
    notes: From workbook defined name.
  - id: ep_lambda_epd_bounceshot
    name: EPD_BOUNCESHOT
    type: excel_named_formula
    excel_definition: LAMBDA(bsc, bst, astral_delivrance, (1 + SUM(ARRAYFORMULA(BSC^(SEQUENCE(BST)) * (1+Astral_Delivrance)^SEQUENCE(BST)))))
    notes: From workbook defined name.
  - id: ep_lambda_epd_bsc
    name: EPD_BSC
    type: excel_named_formula
    excel_definition: "LAMBDA(ws_level, substat, vault, LET(\n  WS, ws_level * 0.8%,\n  VaultBonus, 1 + vault,\n\n(WS + Substat)\
      \ * VaultBonus))"
    notes: From workbook defined name.
  - id: ep_lambda_epd_bst
    name: EPD_BST
    type: excel_named_formula
    excel_definition: "LAMBDA(ws_level, perk, substat, LET(\n  WS, 1 + ws_level,\n  VaultBonus, 1 + vault,\n\nWS + Perk +\
      \ FLOOR(Substat)))"
    notes: From workbook defined name.
  - id: ep_lambda_epd_critical
    name: EPD_CRITICAL
    type: excel_named_formula
    excel_definition: "LAMBDA(cc, cf, scc, scm, being_annihilator, LET(\n  CCm, MIN(1, CC),\n  normalCrit, (1-CCm) + (CCm*CF*(1-SCC)\
      \ + CCm*CF*SCC*SCM),\n\n  Streak, being_annihilator,\n  StreakChance, CCm * SCC,\n  piZero, 1 / (1 + Streak * StreakChance),\n\
      \  pistreak, (Streak * StreakChance) / (1 + Streak * StreakChance),\n  BACritF, CF * SCM,\n\npiZero * normalCrit + pistreak\
      \ * BACritF))"
    notes: From workbook defined name.
  - id: ep_lambda_epd_crit_chance
    name: EPD_CRIT_CHANCE
    type: excel_named_formula
    excel_definition: "LAMBDA(ws_level, has_card, card_level, relic, vault, substat, has_mastery, mastery_level, LET(\n  WS,\
      \ (1%+(1%*ws_level)),\n  CardCC, IF(has_card, 4%+ 1% * card_level+IF(has_mastery, 1% * (1+mastery_level), 0), 0),\n\n\
      WS + relic + vault + Substat + CardCC))"
    notes: From workbook defined name.
  - id: ep_lambda_epd_dpm
    name: EPD_DPM
    type: excel_named_formula
    excel_definition: "LAMBDA(ws_level, wsp_level, lab_level, substat, relic, vault, has_mastery, mastery_level, LET(\n  WS,\
      \ VLOOKUP(ws_level, WSValues!$I:$J, 2, FALSE)/1000,\n  Lab, 1 + 2% * lab_level,\n  WSPlus, 1 + 0.01 * wsp_level,\n \
      \ RelicBonus, 1 + relic,\n  VaultBonus, 1 + vault,\n  CardRNGMastery, IF(has_mastery, 1 + 0.2 * (1+mastery_level), 1),\n\
      \n(WS * Lab + Substat) * WSPlus * RelicBonus * VaultBonus * CardRNGMastery))"
    notes: From workbook defined name.
  - id: ep_lambda_epd_maxrend
    name: EPD_MAXREND
    type: excel_named_formula
    excel_definition: "LAMBDA(has_rend, lab_level, substat, wsp_level, LET(\n  Lab, lab_level * 25%,\n  Wsp, 1+(wsp_level\
      \ * 1%),\nIF(has_rend, (8 + Substat + Lab) * Wsp, 1)))"
    notes: From workbook defined name.
  - id: ep_lambda_epd_msc
    name: EPD_MSC
    type: excel_named_formula
    excel_definition: "LAMBDA(ws_level, substat, vault, LET(\n  WS, ws_level * 0.5%,\n  VaultBonus, 1 + vault,\n(WS + Substat)\
      \ * VaultBonus))"
    notes: From workbook defined name.
  - id: ep_lambda_epd_mst
    name: EPD_MST
    type: excel_named_formula
    excel_definition: "LAMBDA(ws_level, substat, LET(\n  WS, 2 + ws_level,\nWS + FLOOR(Substat)))"
    notes: From workbook defined name.
  - id: ep_lambda_epd_multishot
    name: EPD_MULTISHOT
    type: excel_named_formula
    excel_definition: LAMBDA(msc, mst, 1 + MSC * (MST-1))
    notes: From workbook defined name.
  - id: ep_lambda_epd_range
    name: EPD_RANGE
    type: excel_named_formula
    excel_definition: "LAMBDA(ws_level, has_card, card_level, lab_level, substat, LET(\n  WS, 30 + 0.5 * ws_level,\n  CardRNG,\
      \ IF(has_card, 1.1 + 0.05 * card_level, 1),\n  Lab, 1 + 2% * lab_level,\n\nFUDDSMATH_RANGE(WS * CardRNG * Lab + Substat)))"
    notes: From workbook defined name.
  - id: ep_lambda_epd_rangedpm
    name: EPD_RANGEDPM
    type: excel_named_formula
    excel_definition: LAMBDA(range, dpm, kill_at_range, 1 + range * dpm * kill_at_range)
    notes: From workbook defined name.
  - id: ep_lambda_epd_rapidfire
    name: EPD_RAPIDFIRE
    type: excel_named_formula
    excel_definition: LAMBDA(rfc, rfd, bps, (1 + 4 * RFC*RFD*BPS) / (1 + RFC*RFD*BPS))
    notes: From workbook defined name.
  - id: ep_lambda_epd_rfc
    name: EPD_RFC
    type: excel_named_formula
    excel_definition: "LAMBDA(ws_level, substat, vault, LET(\n  WS, ws_level * 0.4%,\n  VaultBonus, 1 + vault,\n(WS + Substat)\
      \ * VaultBonus))"
    notes: From workbook defined name.
  - id: ep_lambda_epd_rfd
    name: EPD_RFD
    type: excel_named_formula
    excel_definition: "LAMBDA(ws_level, substat, LET(\n  WS, 0.6 + ws_level * 0.05,\nWS + Substat))"
    notes: From workbook defined name.
  - id: ep_lambda_epd_uwcritical
    name: EPD_UWCRITICAL
    type: excel_named_formula
    excel_definition: LAMBDA(cc, cf, scc, scm, (1+CC*CF)*(1+CC*SCC*SCM))
    notes: From workbook defined name.
  - id: ep_lambda_epg_assist_sub_cap
    name: EPG_ASSIST_SUB_CAP
    type: excel_named_formula
    excel_definition: LAMBDA(has_assist, stone_cap, lab_cap, IF(has_assist, (1 + stone_cap + lab_cap) / 100, 0))
    notes: From workbook defined name.
  - id: ep_lambda_ep_cl_dps
    name: EP_CL_DPS
    type: excel_named_formula
    excel_definition: 'LAMBDA(cl_damage, cl_quant, cl_chance, multi_rapid_bounce, bullet_per_second, cl_damage*cl_quant*cl_chance

      *multi_rapid_bounce*bullet_per_second)'
    notes: From workbook defined name.
  - id: ep_lambda_ep_dw_dps
    name: EP_DW_DPS
    type: excel_named_formula
    excel_definition: LAMBDA(hasdw, dwdamage, dwquantity, dwcooldown, dwdamageamp, IF(hasdw, DWDamage/DWCooldown* DwQuantity*
      (5+ dwDamageAmp*1.5), 0))
    notes: From workbook defined name.
  - id: ep_lambda_ep_slm_dps
    name: EP_SLM_DPS
    type: excel_named_formula
    excel_definition: LAMBDA(sm_damage, sl_damage, sm_cooldown, sm_heat, sm_aoe, sm_heat * sm_aoe * sm_damage * sl_damage
      / sm_cooldown)
    notes: From workbook defined name.
  - id: ep_lambda_ep_sl_final_bonus
    name: EP_SL_FINAL_BONUS
    type: excel_named_formula
    excel_definition: LAMBDA(sl_coverage, sl_bonus, 1 + (sl_bonus-1) * sl_coverage)
    notes: From workbook defined name.
  - id: ep_lambda_ep_sm_dps
    name: EP_SM_DPS
    type: excel_named_formula
    excel_definition: LAMBDA(sm_damage, sm_quant, sm_cooldown, sm_coverfire, sm_heat, sm_aoe, sm_heat * sm_aoe * (sm_damage
      * sm_quant / sm_cooldown + sm_coverfire))
    notes: From workbook defined name.
  - id: ep_lambda_ep_uw_sl_coverage
    name: EP_UW_SL_COVERAGE
    type: excel_named_formula
    excel_definition: LAMBDA(sl_quant, sl_angle, MIN(100%, sl_quant * sl_angle / 360))
    notes: From workbook defined name.
  - id: ep_lambda_ep_uw_total_damage
    name: EP_UW_TOTAL_DAMAGE
    type: excel_named_formula
    excel_definition: LAMBDA(dw, cl, sm, slm, sl, ps, ilm, uw_damage_boost, st_uw_mastery, uw_crit_card, uw_damage_boost *
      ((DW+SM+CL+PS+ILM) * SL * st_uw_mastery + SLM) * uw_crit_card * st_uw_mastery)
    notes: From workbook defined name.
  - id: ep_lambda_stat_uw_cl_final_ch
    name: STAT_UW_CL_FINAL_CH
    type: excel_named_formula
    excel_definition: LAMBDA(base, substat, (base+substat))
    notes: From workbook defined name.
  - id: ep_lambda_stat_uw_cl_final_dmg
    name: STAT_UW_CL_FINAL_DMG
    type: excel_named_formula
    excel_definition: LAMBDA(base, substat, hasperk, (base+substat)*IF(HasPerk,2,1))
    notes: From workbook defined name.
  - id: ep_lambda_stat_uw_cl_final_qty
    name: STAT_UW_CL_FINAL_QTY
    type: excel_named_formula
    excel_definition: LAMBDA(base, substat, hasdc, FLOOR(base+substat) + IF(HasDC,0.6,0))
    notes: From workbook defined name.
  - id: ep_lambda_stat_uw_dw_final_cd
    name: STAT_UW_DW_FINAL_CD
    type: excel_named_formula
    excel_definition: LAMBDA(base, substat, gcompreduction, (base+substat)*gcompreduction)
    notes: From workbook defined name.
  - id: ep_lambda_stat_uw_dw_final_dmg
    name: STAT_UW_DW_FINAL_DMG
    type: excel_named_formula
    excel_definition: LAMBDA(base, substat, base+substat)
    notes: From workbook defined name.
  - id: ep_lambda_stat_uw_dw_final_qty
    name: STAT_UW_DW_FINAL_QTY
    type: excel_named_formula
    excel_definition: LAMBDA(base, substat, hasperk, FLOOR(base+substat+IF(hasperk,1,0)))
    notes: From workbook defined name.
  - id: ep_lambda_stat_uw_sl_final_angle
    name: STAT_UW_SL_FINAL_ANGLE
    type: excel_named_formula
    excel_definition: LAMBDA(base, substat, (base+substat))
    notes: From workbook defined name.
  - id: ep_lambda_stat_uw_sl_final_dmg
    name: STAT_UW_SL_FINAL_DMG
    type: excel_named_formula
    excel_definition: 'LAMBDA(base, sl_lightrange, substat, relic, vault, has_perk, (base+substat)*(1+relic)*(1+vault)*

      IF(has_perk, 1.5, 1)*sl_lightrange)'
    notes: From workbook defined name.
  - id: ep_lambda_stat_uw_sl_final_lr
    name: STAT_UW_SL_FINAL_LR
    type: excel_named_formula
    excel_definition: LAMBDA(sl_lightrange, dpm, 1+IF(ISNUMBER(sl_lightrange), sl_lightrange * (dpm-1), 0))
    notes: From workbook defined name.
  - id: ep_lambda_stat_uw_sm_final_cd
    name: STAT_UW_SM_FINAL_CD
    type: excel_named_formula
    excel_definition: LAMBDA(base, substat, gcompreduction, (base+substat)*gcompreduction)
    notes: From workbook defined name.
  - id: ep_lambda_stat_uw_sm_final_cf
    name: STAT_UW_SM_FINAL_CF
    type: excel_named_formula
    excel_definition: LAMBDA(sm_damage, cf_time, IF(ISNUMBER(cf_time), sm_damage * (1 / cf_time), 0))
    notes: From workbook defined name.
  - id: ep_lambda_stat_uw_sm_final_dmg
    name: STAT_UW_SM_FINAL_DMG
    type: excel_named_formula
    excel_definition: LAMBDA(base, substat, (base+substat))
    notes: From workbook defined name.
  - id: ep_lambda_stat_uw_sm_final_qty
    name: STAT_UW_SM_FINAL_QTY
    type: excel_named_formula
    excel_definition: LAMBDA(base, substat, has_perk, FLOOR((base+substat) + IF(has_perk, 4, 0)))
    notes: From workbook defined name.
ids_helpers:
  status: complete
stacking_rules:
  status: complete
issues:
- id: ep_defined_name_missing_param
  name: EPD_BST uses vault without parameter
  workbook: Copy of Effective Paths v5.00.01.xlsx
  defined_name: EPD_BST
  detail: Defined name text contains 'VaultBonus, 1 + vault' but lambda params are (ws_level, perk, substat).
  policy: fail_closed_or_explicit_patch_only
