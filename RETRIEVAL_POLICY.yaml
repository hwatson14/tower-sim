retrieval_policy:
  first_pass:
    - manifest.json
    - readme.md
    - START_HERE_FOR_AI.md
    - MASTER_SURFACE_TRUST_LEDGER.csv
    - SURFACE_PRIORITY_REGISTRY.csv
    - UNKNOWNS_OPERATING_POLICY.csv
    - kb/index.md
  mechanics_questions:
    prefer:
      - kb/**/tables/**
      - kb/**/contracts/**
      - MASTER_SURFACE_TRUST_LEDGER.csv
      - UNKNOWNS_OPERATING_POLICY.csv
    avoid_first_pass:
      - kb/community/**
      - kb/advisory/**
  calculator_questions:
    prefer:
      - run_stats.py
      - compilers/**
      - engine/stat_engine.py
      - models/**
      - parsers/**
      - out/diagnostics.json
      - out/statbook.json
      - out/stat_inputs.json
  progression_questions:
    prefer:
      - engine/progression_state.py
      - engine/progression_recalc_bridge.py
      - engine/perk_timeline_state.py
      - engine/workshop_progression_policy.py
      - engine/free_upgrade_generation_policy.py
      - engine/wave_progression_policy.py
      - engine/boss_wave_engine.py
      - docs/15_engine_readiness_audit.md
      - docs/16_progression_engine_scope_and_burndown.md
  merge_questions:
    prefer:
      - MERGE_NOTES_FOR_AI.md
      - governance/R36_MASTER_MERGE.md
      - governance/R36_PROGRESSION_ENGINE_MERGE.md
      - governance/R37_OPTIMIZER_MERGE.md
      - START_HERE_FOR_AI.md
      - freeze-status.md
  output_truth:
    canonical_bundle: out/
    rebuild_command: python run_stats.py
  refusal_rules:
    - Do not claim final simulator closure where package docs retain open items.
    - Do not infer missing scenario runtime surfaces as if emitted.
