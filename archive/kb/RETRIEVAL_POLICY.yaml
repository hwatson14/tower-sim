package_purpose: >
  Curated AI-facing Tower knowledge base for ChatGPT lookup, mechanics reasoning,
  theorycraft support, strategy support, and simulator work for the intended simulator scope.
first_pass_sequence:
  - START_HERE_FOR_AI.md
  - CHATGPT_KB_PROFILE.yaml
  - KNOWLEDGE_ROLE_SCHEMA.yaml
  - KNOWLEDGE_ROLE_REGISTRY.csv
  - manifest.json
  - RETRIEVAL_POLICY.yaml
  - TASK_ENTRYPOINTS.yaml
  - SURFACE_EXECUTION_ORDER.yaml
  - SURFACE_PRIORITY_REGISTRY.csv
  - MASTER_SURFACE_TRUST_LEDGER.csv
  - UNKNOWNS_OPERATING_POLICY.csv
  - kb/index.md
default_rules:
  use_canonical_tables_first_for_mechanics: true
  use_contracts_second_for_semantics: true
  use_strategy_and_community_for_strategy_queries: true
  use_sources_for_grounding_only: true
  never_override_canon_with_community_or_advisory: true
  must_route_via_task_entrypoints_first: true
  later_or_lower_tier_surfaces_cannot_override_earlier_surfaces: true
  forbidden_approximation: >
    Do not silently interpolate or invent exact values for accepted-boundary rows
    or out-of-scope timing surfaces.
  unknown_response_contract: >
    Report unknown, accepted_boundary, package_canon, or out_of_scope as appropriate
    and refuse exact inference unless speculation is explicitly requested and labeled noncanonical.
  scope_boundary_file: kb/ledgers/tables/scope-boundary-registry.csv
  simulator_boundary_file: kb/ledgers/tables/simulator-scope-boundary-ledger.csv
  knowledge_role_schema: KNOWLEDGE_ROLE_SCHEMA.yaml
  knowledge_role_registry: KNOWLEDGE_ROLE_REGISTRY.csv
query_routing:
  lookup:
    prefer:
      - canonical_mechanics
      - canonical_contract
      - package_canon
      - boundary_policy
  mechanics_reasoning:
    prefer:
      - canonical_contract
      - canonical_mechanics
      - package_canon
      - boundary_policy
  strategy:
    prefer:
      - strategy_guidance
      - community_signal
      - canonical_mechanics
      - boundary_policy
  diagnosis:
    prefer:
      - strategy_guidance
      - community_signal
      - canonical_mechanics
      - provenance_grounding
  provenance:
    prefer:
      - provenance_grounding
      - explanatory_secondary
      - control_plane_metadata
