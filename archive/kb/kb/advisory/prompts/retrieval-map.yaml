rules:
  mechanics:
    prefer:
      - canonical tables
      - canonical contracts
      - package canon
      - boundary policy
    avoid_first_pass:
      - community
      - advisory
  strategy:
    prefer:
      - advisory
      - community
      - canonical tables
      - boundary policy
  unknown_handling: >
    Use scope-boundary-registry.csv and simulator-scope-boundary-ledger.csv as the active
    boundary surfaces. Do not interpolate the 17 BC rows marked accepted_unknown_boundary,
    and treat broader same-tick micro-precedence as out_of_scope_tick_precedence.
  advisory_rule: >
    Advisory and community surfaces may help theorycrafting and practical recommendations
    but must not override canonical tables, contracts, package canon, or boundary policy.
