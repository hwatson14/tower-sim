  stat_target_contract_schema:
    required_fields:
    - stat_target_id
    - source_family
    - derivation_kind
    optional_fields:
    - entity_section
    - attribute_section
    - metric_section
    - formula_contract
    derivation_kind_allowed:
    - direct_input
    - computed_component
    - final_resolved
    final_resolved_source_family_policy: source_family_must_be_null_or_composed_from_contributing_rows
    canonical_target_policy: stat_target_id_must_resolve_to_v2_target_stats
    contributor_id_section_contract:
      source_family_separator: __
      semantic_separator: .
      required_sections:
      - source_family
      optional_sections:
      - entity
      - attribute
      - metric
      semantic_sections_optional: true
      policy: contributor_id_must_be_prefixed_by_source_family_and_semantic_sections_use_dot_when_present
    example_health_final_row:
      stat_target_id: tower_hp
      source_family: null
      derivation_kind: final_resolved
      entity_section: tower
      attribute_section: health
      metric_section: hp
      formula_contract: final=((base+loadout_delta)*enhancement)+tier_delta
