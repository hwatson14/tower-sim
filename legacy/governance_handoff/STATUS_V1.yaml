authority_status: "bridge_non_authoritative"
authority_note: "Legacy v1 status artifact retained for migration context; CONTRACT.md and docs/v2/TOWERSIM_V2_MASTER_SPEC.md are authoritative for active architecture direction."

objective: "Unify TowerSim V1 static stat construction into one canonical staged pipeline"
current_phase: "Architecture locked; implementation migration underway"
architecture_locked: true
scope:
  v1:
    stages:
      - baseline_account
      - baseline_gem_respec
      - baseline_loadout
    in_scope:
      - workshop_coin_level
      - UWs_static_always_on
      - relics
      - labs
      - bots_static_only
      - cards
      - modules
    out_of_scope:
      - themes
      - guardians
      - perks
      - timing_engine
      - free_upgrades_progression
      - ELS_EHLS_wave_progression
      - triggered_or_periodic_effects
  v2:
    owns:
      - wave_progression
      - perks
      - free_upgrades_over_time
      - ELS_EHLS_progression
      - UW_timing_uptime_overlaps
      - bot_timing_uptime_overlaps
      - runtime_mutation
  v5:
    owns:
      - themes
      - guardians
      - econ_meta
canonical_owner_files:
  - tower_sim/engines/stat_input_compiler.py
  - tower_sim/engines/stat_pipeline.py
  - tower_sim/engines/stat_engine.py
  - tower_sim/engines/statbook_builder.py
runtime_mutator_files:
  - tower_sim/engines/combat_stat_derivation.py
consumer_only_files:
  - tower_sim/engines/survivability_pipeline.py
  - tower_sim/engines/edamage_pipeline.py
main_problems:
  - "Static stat truth is split across canonical and domain pipelines"
  - "Cards/modules are not yet fully canonicalized into baseline_loadout"
  - "Orchestration still compensates for split-brain static ownership"
  - "Formula verification discipline must be tightened"
confirmed_findings:
  - "Wall Health and Wall Regen handling needed explicit wall-specific algebra rather than generic multiplier semantics"
  - "Stage boundaries must be executable, not implicit"
completed_or_started:
  - "Architecture target locked"
  - "Themes and guardians moved out of V1 into V5"
  - "Stage wrappers conceptually introduced for baseline_account and baseline_gem_respec in thread-local work"
  - "Initial wall semantics issue identified and patched in thread-local work with targeted tests"
next_tasks:
  - "Confirm branch state against handoff assumptions"
  - "Implement canonical baseline_loadout in stat_input_compiler.py"
  - "Move static card contributors into canonical path"
  - "Move static module contributors into canonical path"
  - "Demote duplicate static ownership in survivability_pipeline.py"
  - "Demote duplicate static ownership in edamage_pipeline.py"
  - "Simplify stat_pipeline.py and combat_stat_derivation.py to stop merging parallel static paths"
rules:
  - "No rebuild"
  - "Prefer editing existing files"
  - "New files only if clearly justified"
  - "All formula-affecting changes must be verified against the wiki first"
  - "Each checkpoint must update status, changed files, tests run, remaining risks"
suggested_first_checkpoint_for_codex:
  name: "baseline_loadout canonicalization"
  tasks:
    - "Audit card and module contributor ownership"
    - "Add or confirm compile_baseline_loadout_inputs(...) in stat_input_compiler.py"
