openapi: 3.1.1
info:
  title: Tower Runner API
  version: 1.1.0
  description: >
    SnapshotReader endpoints for precomputed TowerSim artifacts, proxied through the
    authenticated Worker (no direct raw GitHub access required).

servers:
  - url: https://tower-runner.tower-runner.workers.dev

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

paths:
  /snapshot/ids_dump:
    get:
      operationId: getIdsDumpSnapshot
      summary: Get latest canonical IDS dump snapshot (proxied).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized

  /snapshot/base_stats:
    get:
      operationId: getBaseStatsSnapshot
      summary: Get latest base stats snapshot (proxied).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized

  /snapshot/inventory:
    get:
      operationId: getInventorySnapshot
      summary: Get latest inventory snapshot (proxied).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized

  /snapshot/loadout:
    get:
      operationId: getLoadoutSnapshot
      summary: Get latest loadout snapshot (proxied).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Unauthorized
