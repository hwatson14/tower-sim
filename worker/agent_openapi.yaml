openapi: 3.1.1
info:
  title: Tower Runner API
  version: 1.3.0
  description: Precomputed snapshot fetch via authenticated Cloudflare Worker.

servers:
  - url: https://tower-runner.tower-runner.workers.dev

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key

  schemas:
    SnapshotMeta:
      type: object
      additionalProperties: true
      properties:
        source:
          type: string
        owner:
          type: string
        repo:
          type: string
        ref:
          type: string
        path:
          type: string
        content_sha:
          type: string
          nullable: true
        fetched_at_utc:
          type: string
    SnapshotResponse:
      type: object
      additionalProperties: true
      properties:
        meta:
          $ref: "#/components/schemas/SnapshotMeta"
        data:
          type: object
          additionalProperties: true

paths:
  /snapshot/ids_dump:
    get:
      operationId: getIdsDumpSnapshot
      summary: Get latest canonical IDS dump snapshot (proxied).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "401":
          description: Unauthorized

  /snapshot/base_stats:
    get:
      operationId: getBaseStatsSnapshot
      summary: Get latest base stats snapshot (proxied).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "401":
          description: Unauthorized

  /snapshot/inventory:
    get:
      operationId: getInventorySnapshot
      summary: Get latest inventory snapshot (proxied).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "401":
          description: Unauthorized

  /snapshot/loadout:
    get:
      operationId: getLoadoutSnapshot
      summary: Get latest loadout snapshot (proxied).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "401":
          description: Unauthorized

  /snapshot/base_components:
    get:
      operationId: getBaseComponentsSnapshot
      summary: Get latest base-stat component snapshot (themes/labs/UWs/vault/relics/workshop/guardians/bots).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "401":
          description: Unauthorized

  /snapshot/inventory_components:
    get:
      operationId: getInventoryComponentsSnapshot
      summary: Get latest inventory component snapshot (cards/modules/presets/shard allocation).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "401":
          description: Unauthorized

  /snapshot/run_stats:
    get:
      operationId: getRunStatsSnapshot
      summary: Get latest start/loadout-delta/end stat rows snapshot.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResponse"
        "401":
          description: Unauthorized

  /ping:
    get:
      operationId: ping
      summary: Healthcheck endpoint.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ok, now_utc]
                properties:
                  ok:
                    type: boolean
                  now_utc:
                    type: string
        "401":
          description: Unauthorized
