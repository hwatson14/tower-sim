openapi: 3.1.1
info:
  title: TowerSim Agent (Artifacts + Optimisers)
  version: 1.0.0
  description: >
    Fetch-only access to published TowerSim artifacts, plus optimiser task calls
    that accept snapshot payloads (no IDS CSV).

servers:
  - url: https://raw.githubusercontent.com
    description: Public artifact fetches (fast path)
  - url: https://tower-runner.tower-runner.workers.dev
    description: TowerSim optimiser runner base URL

paths:
  /hwatson14/tower-sim/ids-dump-latest/audit/inventory_latest.json:
    get:
      operationId: fetchInventoryLatest
      summary: Fetch latest inventory JSON (raw text).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string

  /hwatson14/tower-sim/ids-dump-latest/audit/base_stats_latest.json:
    get:
      operationId: fetchBaseStatsLatest
      summary: Fetch latest base stats JSON (raw text).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string

  /hwatson14/tower-sim/ids-dump-latest/audit/loadout_latest.json:
    get:
      operationId: fetchLoadoutLatest
      summary: Fetch latest loadout JSON (raw text).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string

  /hwatson14/tower-sim/ids-dump-latest/audit/ids_dump_latest.json:
    get:
      operationId: fetchIdsDumpLatest
      summary: Fetch latest canonical IDS dump JSON (raw text).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string

  /run/task:
    post:
      operationId: runOptimiserTask
      summary: Invoke snapshot-first optimiser tasks (no IDS CSV).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task, objective, account_snapshot]
              additionalProperties: false
              properties:
                task:
                  type: string
                  enum:
                    - OPTIMIZE_LOADOUT
                    - OPTIMIZE_MODULE_SUBSTATS
                    - OPTIMIZE_STONES
                    - OPTIMIZE_COINS
                    - OPTIMIZE_LABS
                    - SENSITIVITY_REPORT
                objective:
                  type: string
                  enum:
                    - MAX_WAVE
                    - ECON_PER_HOUR
                account_snapshot:
                  type: object
                  description: ids_dump_latest.json payload or its inner snapshot object.
                loadout_override:
                  type: object
                snapshot_patch:
                  type: object
                loadout_patch:
                  type: object
                constraints:
                  type: object
                debug:
                  type: object
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
