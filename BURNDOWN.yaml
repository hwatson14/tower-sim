remaining_max_wave_completion:
  date_local: '2026-05-23'
  status: tracked_not_complete
  authority_note: >
    The current milestone matrix is useful and KB/QE-backed for Boss Waves
    boss-contact survivability, but it remains explicitly labeled
    not_full_max_wave_model. Full completion means retiring that caveat rather
    than hiding it.
  current_owned_capabilities:
    - all-tier matrix sweeps T1-T21 for Regular plus Attack, Defense, Utility, and Ultimate Weapon Dissonant Run categories
    - matrix evaluates the four named loadout presets and selects best visible candidate per tier/category
    - Dissonant Run restriction truth is KB-owned in kb/global-rules/contracts/dissonant-run-restrictions.yaml
    - QE publishes Dissonant Run active support flags and affected eHP/eDamage/eEcon branch semantics for current tested surfaces
    - default matrix derives boss contact time from 2s base plus QE-owned CF/EN/Slow Aura effects and uses 6% total orb boss damage
    - bridge comparison inputs remain explicit scenario inputs and are not hidden defaults
    - v28 Enemy Skip Decay now defaults to the KB-imported battle-condition magnitude curve in Table 1 ELS recurrence; explicit skip-decay runtime inputs can still override it
    - explicit v28 tournament Damage/Health Decay runtime inputs flow through Table 2 per-row damage/health decay; magnitudes remain explicit until source-owned values are available
    - explicit terminal-pressure max-wave inputs remain optional scenario overrides, but separate non-boss pressure formula discovery is out of current scope; boss-contact waves are the sanctioned proxy/test surface for now
    - Boss Waves payloads and milestone-matrix rows now publish a normalized model_certification block and per-row certification status/blockers so partial max-wave outputs cannot look fully certified
    - Boss Waves model_certification now separately reports which otherwise-missing max-wave inputs are closed by explicit runtime overrides for that run, and marks tournament-only Damage/Health Decay magnitudes as not applicable to normal milestone matrix runs; source-owned blockers remain for default runs where the mechanic is applicable
    - Streamlit Boss Waves now accepts both resolved and complete context statuses from the sanctioned payload path; the Streamlit AppTest harness verifies the T14 Farming summary, five-row Dissonant Run matrix, and 21-row all-tier milestone matrix render without false context errors
  completion_items:
    - id: MW-1
      title: Keep max-wave model scoped to boss-contact proxy with honest terminal-pressure caps
      status: formula_deferred_reference_capped
      owner_path: simulators/evaluator_kernel.py + app/pipeline.py diagnostics
      work: >
        Current user direction says not to invent source-owned non-boss terminal
        pressure formulas. Boss Waves remains the sanctioned proxy/test surface,
        but unsupported high-tier terminal pressure must not be invisible to the
        selected max-wave estimate. Explicit terminal-pressure max-wave inputs
        may still be used as optional scenario overrides; otherwise unsupported
        rows are capped to a positive active milestone/Dissonant PB reference
        while retaining the uncapped boss-only value for diagnostics. Deriving
        separate fleet, elite, protector, or armored-hit formulas is still not
        part of current completion.
      acceptance:
        - model certification lists non-boss terminal pressure formulas as a blocker when unsupported terminal pressures are present and explicit terminal max-wave overrides do not close them
        - selected max wave is empirically capped to a positive active milestone/Dissonant PB reference for unsupported terminal-pressure rows
        - diagnostics retain the uncapped boss-only selected wave and the terminal-pressure limiter so capped estimates are auditable
      closure_note: >
        app.pipeline now accepts explicit fleet_terminal_max_wave,
        elite_terminal_max_wave, protector_terminal_max_wave, and
        armored_terminal_max_wave runtime inputs through the scenario runtime
        contract. The Boss Waves summary and diagnostics publish
        terminal_pressure_limits, terminal_pressure_limiter, and
        terminal_pressure_limited when a caller supplies those optional inputs.
        Unsupported high-tier pressure remains explicitly advertised through
        unsupported_terminal_pressures and model_completion_blockers when source
        formulas or full explicit closure are missing. The selected max-wave
        value is now capped by unsupported_pressure_empirical_reference when a
        positive active reference exists, and the uncapped boss-contact value is
        retained in unsupported_pressure_reference_limit for audit/debug use.
        Flame Bot all-or-nothing DR is no longer probability-weighted into
        selected damage reduction: Boss Waves publishes the static tag chance
        and miss/hit diagnostic lanes, while selected `avg` only assumes the
        tag when the modeled chance is near-certain (>=95%).
