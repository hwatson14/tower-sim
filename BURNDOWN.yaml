      outcome: completed
      summary:
        - Every meaningful helper, constant block, and compilation/query-preparation section in compilers/stat_input_compiler.py is now classified.
        - Every move or split candidate names a target owner and destination module.
        - Regression anchors are recorded without implying that Phase 2B extraction already happened.
