    required_checks:
      - control_stack_consistency_review
    evidence_paths:
      - ACTIVE_TRANCHE.md
      - BURNDOWN.yaml
      - AI_EXECUTION_PLAN.md
      - README.md
      - ARCHITECTURE.md
    blockers: []
