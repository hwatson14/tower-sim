version: 2
program: tower-sim-execution
canonical_plan: AI_EXECUTION_PLAN.md
active_phase_id: PH1
active_phase_name: Canonical planning truth and archive closure
active_tranche_id: PH1-TRANCHE-A_CONTROL_STACK_CLOSEOUT

status_dimensions:
  delivery:
    - not_started
    - in_progress
    - implemented
    - blocked
    - done
  verification:
    - not_verified
    - partial
    - verified
  review:
    - draft
    - ready_for_review
    - approved

phase_gates:
  - phase_id: PH1
    phase_name: Canonical planning truth and archive closure
    exit_requires:
      - bootstrap_tranche_closed_or_superseded
      - one_canonical_plan_exists_and_is_current
      - roadmap_content_absorbed
      - major_docs_do_not_contradict_plan
      - all_root_archive_artifacts_have_documented_disposition
      - current_open_obligations_mapped_to_concrete_work
      - control_files_use_same_phase_and_tranche_vocabulary
  - phase_id: PH2
    phase_name: Query Engine ownership completion
    exit_requires:
      - compiler_query_seam_not_materially_owner_ambiguous
      - covered_family_manifest_exists_and_is_current
      - covered_family_delegation_is_explicit_and_governed
      - parity_status_exists_by_declared_family_and_surface
      - benchmark_evidence_exists_for_delegated_path
      - compatibility_entrypoint_preserved
      - no_major_doc_implies_dual_ownership

tranches:
  - id: PH1-TRANCHE-A_CONTROL_STACK_CLOSEOUT
    title: Control-stack closeout and tranche promotion
    phase_id: PH1
    delivery_status: in_progress
    verification_status: partial
    review_status: ready_for_review
    depends_on: []
    owner_surfaces:
      - AI_EXECUTION_PLAN.md
      - ACTIVE_TRANCHE.md
      - BURNDOWN.yaml
      - AGENTS.md
      - README.md
      - ARCHITECTURE.md
    scope_in:
      - bootstrap tranche closeout
      - canonical plan reference rename
      - phase-gated control-stack promotion
      - major doc pointer alignment
    scope_out:
      - runtime mechanic changes
      - Query Engine code changes
      - archive content implementation
      - estimator or optimiser work
    required_outputs:
      - control_stack_closeout_note
      - updated_active_tranche
      - updated_burndown
      - updated_major_doc_pointers
    acceptance_criteria:
      - bootstrap_tranche_closed_or_superseded
      - active_tranche_points_to_phase_gated_system
      - burndown_uses_phase_gated_ids
      - no_major_control_file_points_to_old_plan_name
      - next_executable_phase1_tranche_is_unambiguous
    required_checks:
      - bootstrap_acceptance_review
      - control_file_consistency_review
      - stale_reference_review
    evidence_paths:
      - AI_EXECUTION_PLAN.md
      - ACTIVE_TRANCHE.md
      - BURNDOWN.yaml
      - AGENTS.md
    blockers: []
    next_action: Close bootstrap control state and promote the first real Phase 1 tranche.

  - id: PH1-TRANCHE-B_CANONICAL_PLAN_AND_TERMINOLOGY_UNIFICATION
    title: Canonical plan and terminology unification
    phase_id: PH1
    delivery_status: not_started
    verification_status: not_verified
    review_status: draft
    depends_on:
      - PH1-TRANCHE-A_CONTROL_STACK_CLOSEOUT
    owner_surfaces:
      - AI_EXECUTION_PLAN.md
      - ARCHITECTURE.md
      - README.md
      - AGENTS.md
    scope_in:
      - canonical plan finalization
      - terminology alignment across major docs
      - roadmap retirement note
    scope_out:
      - runtime mechanic changes
      - product feature implementation
    required_outputs:
      - canonical_execution_plan
      - aligned_major_doc_language
      - roadmap_retirement_note
    acceptance_criteria:
      - one_canonical_execution_plan_exists
      - no_major_doc_contradicts_layer_or_phase_language
      - roadmap_content_absorbed_or_explicitly_rejected
    required_checks:
      - terminology_consistency_review
      - major_doc_pointer_review
    evidence_paths: []
    blockers: []
    next_action: Finalize canonical naming and remove parallel planning truth.

  - id: PH1-TRANCHE-C_R86_OBLIGATION_CLOSURE_LEDGER
    title: R86 obligation closure ledger
    phase_id: PH1
    delivery_status: not_started
    verification_status: not_verified
    review_status: draft
    depends_on:
      - PH1-TRANCHE-A_CONTROL_STACK_CLOSEOUT
    owner_surfaces:
      - AI_EXECUTION_PLAN.md
      - R86_CODEX_HANDOFF_GUARDRAILS.md
      - R86_IMPLEMENTATION_SCOPE_AND_ACCEPTANCE.md
      - R86_WORKED_EXAMPLES.md
    scope_in:
      - legacy obligation mapping
    scope_out:
      - direct code changes
      - archive merges
    required_outputs:
      - r86_obligation_closure_ledger
    required_output_schema:
      - source_doc
      - source_section
      - obligation_type
      - current_status
      - mapped_phase
      - mapped_tranche
      - owner_surface
      - evidence_or_gap
      - notes
    acceptance_criteria:
      - every_still_relevant_r86_obligation_is_mapped
      - landed_items_are_separated_from_open_items
      - vague_r86_complete_incomplete_wording_removed
    required_checks:
      - r86_mapping_review
      - obligation_status_review
    evidence_paths: []
    blockers: []
    next_action: Convert R86 from vague historical status into concrete current work items.

  - id: PH1-TRANCHE-D_ARCHIVE_DISPOSITION_LEDGER
    title: Archive disposition ledger
    phase_id: PH1
    delivery_status: not_started
    verification_status: not_verified
    review_status: draft
    depends_on:
      - PH1-TRANCHE-A_CONTROL_STACK_CLOSEOUT
    owner_surfaces:
      - AI_EXECUTION_PLAN.md
      - root_archive_artifacts
    scope_in:
      - archive disposition tracking
    scope_out:
      - archive content implementation
      - runtime feature work
    required_outputs:
      - archive_disposition_ledger
    required_output_schema:
      - artifact
      - disposition
      - why
      - absorbed_into
      - still_open_items
      - retirement_condition
      - merge_as_is_allowed
    acceptance_criteria:
      - each_root_artifact_has_one_disposition_only
      - retirement_conditions_are_explicit
      - direct_merge_forbidden_artifacts_are_named
    required_checks:
      - archive_disposition_review
      - retirement_condition_review
    evidence_paths: []
    blockers: []
    next_action: Classify every root artifact before any retirement or reuse.

  - id: PH1-TRANCHE-E_CONTROL_STACK_ALIGNMENT
    title: Control-stack alignment
    phase_id: PH1
    delivery_status: not_started
    verification_status: not_verified
    review_status: draft
    depends_on:
      - PH1-TRANCHE-B_CANONICAL_PLAN_AND_TERMINOLOGY_UNIFICATION
      - PH1-TRANCHE-C_R86_OBLIGATION_CLOSURE_LEDGER
      - PH1-TRANCHE-D_ARCHIVE_DISPOSITION_LEDGER
    owner_surfaces:
      - ACTIVE_TRANCHE.md
      - BURNDOWN.yaml
      - AGENTS.md
      - README.md
      - ARCHITECTURE.md
    scope_in:
      - control-file and doc pointer alignment
    scope_out:
      - Phase 2 implementation work
    required_outputs:
      - updated_active_tranche
      - updated_burndown
      - updated_doc_references
    acceptance_criteria:
      - phase_and_tranche_ids_are_consistent
      - no_stale_plan_filename_remains
      - control_files_point_to_canonical_truth
    required_checks:
