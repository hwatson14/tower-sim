version: 2
program: tower-sim-execution
canonical_plan: AI_EXECUTION_PLAN.md
active_phase_id: PH2
active_phase_name: Query Engine ownership completion
active_tranche_id: PH2-TRANCHE-C_COVERED_FAMILY_DELEGATION_MANIFEST

status_dimensions:
  delivery:
    - not_started
    - in_progress
    - implemented
    - blocked
    - done
  verification:
    - not_verified
    - partial
    - verified
  review:
    - draft
    - ready_for_review
    - approved

phase_gates:
  - phase_id: PH1
    phase_name: Canonical planning truth and archive closure
    exit_requires:
      - bootstrap_tranche_closed_or_superseded
      - one_canonical_plan_exists_and_is_current
      - roadmap_content_absorbed
      - major_docs_do_not_contradict_plan
      - all_root_archive_artifacts_have_documented_disposition
      - current_open_obligations_mapped_to_concrete_work
      - control_files_use_same_phase_and_tranche_vocabulary
  - phase_id: PH2
    phase_name: Query Engine ownership completion
    exit_requires:
      - compiler_query_seam_not_materially_owner_ambiguous
      - covered_family_manifest_exists_and_is_current
      - covered_family_delegation_is_explicit_and_governed
      - parity_status_exists_by_declared_family_and_surface
      - benchmark_evidence_exists_for_delegated_path
      - compatibility_entrypoint_preserved
      - no_major_doc_implies_dual_ownership

tranches:
  - id: PH1-TRANCHE-A_CONTROL_STACK_CLOSEOUT
    title: Control-stack closeout and tranche promotion
    phase_id: PH1
    delivery_status: done
    verification_status: verified
    review_status: ready_for_review
    depends_on: []
    owner_surfaces:
      - AI_EXECUTION_PLAN.md
      - ACTIVE_TRANCHE.md
      - BURNDOWN.yaml
      - AGENTS.md
      - README.md
      - ARCHITECTURE.md
    scope_in:
      - bootstrap tranche closeout
      - canonical plan reference rename
      - phase-gated control-stack promotion
      - major doc pointer alignment
    scope_out:
      - runtime mechanic changes
      - Query Engine code changes
      - archive content implementation
      - simulator or optimiser work
    required_outputs:
      - control_stack_closeout_note
      - updated_active_tranche
      - updated_burndown
      - updated_major_doc_pointers
    acceptance_criteria:
      - bootstrap_tranche_closed_or_superseded
      - active_tranche_points_to_phase_gated_system
      - burndown_uses_phase_gated_ids
      - no_major_control_file_points_to_old_plan_name
      - next_executable_phase1_tranche_is_unambiguous
    required_checks:
      - bootstrap_acceptance_review
      - control_file_consistency_review
      - stale_reference_review
    evidence_paths:
      - AI_EXECUTION_PLAN.md
      - ACTIVE_TRANCHE.md
      - BURNDOWN.yaml
      - AGENTS.md
      - README.md
      - ARCHITECTURE.md
    blockers: []
    next_action: Execute Phase 1B now that the bootstrap tranche is closed and the control stack is promoted.

  - id: PH1-TRANCHE-B_CANONICAL_PLAN_AND_TERMINOLOGY_UNIFICATION
