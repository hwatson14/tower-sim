version: 4
program: tower-sim-execution
canonical_plan: AI_EXECUTION_PLAN.md
active_phase_id: PH4
active_phase_name: Full stat-resolution migration to Query Engine
active_tranche_id: PH4-B
active_tranche_plan_section: "Phase 4 — Full stat-resolution migration to Query Engine / PH4-B — Declared family cutover to Query Engine"

status_dimensions:
  delivery:
    - not_started
    - in_progress
    - implemented
    - blocked
    - done
  verification:
    - not_verified
    - partial
    - verified
  review:
    - draft
    - ready_for_review
    - approved

migration_kpis:
  baseline_from_git_version:
    declared_scenario_family_count: 6
    live_delegated_family_count: 1
    live_delegated_surface_count: 8
    current_git_version_canonical_stat_owner: engine/stat_resolution_core.py
    current_git_version_compatibility_entrypoint: engine/stat_engine.py
  target_after_phase4:
    canonical_stat_resolution_owned_by_qe: true
    canonical_logic_allowed_in_engine_stat_engine: false
    canonical_logic_allowed_in_engine_stat_resolution_core: false
    stat_engine_role: thin_compatibility_entrypoint_only_if_retained
    stat_resolution_core_role: non_canonical_legacy_merge_reference_only_or_deleted
  ph4_authority_reset:
    applied: true
    qe_is_canonical_execution_path_for_new_work: true
    stat_resolution_core_is_legacy_reference_only: true
    new_logic_forbidden_in_legacy_surfaces: true
    naming_reset_applied: true
    state_namespace_is_legacy_alias: true
    runtime_mechanic_param_namespace_is_legacy_alias: true
    new_work_must_target_canonical_qe_naming: true
    silent_expansion_of_legacy_naming_forbidden: true
    handoff_docs_are_not_canonical_control_artifacts: true
  tracked_phase4_metrics:
    frozen_family_denominator: verified
    frozen_stat_group_denominator: partial
    migrated_family_count: 0
    declared_routed_family_count: 1
    migrated_stat_group_count: 0
    parity_covered_family_count: 0
    parity_covered_stat_group_count: 0
    benchmarked_migrated_workload_count: 0
    explicit_residual_bucket_count: 7
    legacy_owned_canonical_stat_group_count: 8
    legacy_merge_reference_allowed: true
    legacy_canonical_owner_allowed: false
    new_logic_allowed_in_legacy_surfaces: false
    frozen_scope_categories:
    - family_scoped_canonical_resolution
    - non_family_canonical_stat_resolution
    - compatibility_only_surface
    - legacy_merge_reference_residue
    - out_of_phase4_scope
    frozen_scope_category_changes_after_phase4a: 0
    legacy_merge_reference_residue_count: 3
    compatibility_only_surface_count: 4
    out_of_phase4_scope_count: 4
    canonical_scope_total_count: 14
    canonical_scope_migrated_count: 0
phase_gates:
- phase_id: PH1
  phase_name: Canonical planning truth and archive closure
  exit_requires:
  - bootstrap_tranche_closed_or_superseded
  - one_canonical_plan_exists_and_is_current
  - roadmap_content_absorbed_or_explicitly_rejected
  - major_docs_do_not_contradict_canonical_plan
  - all_root_archive_artifacts_have_documented_disposition
  - current_open_obligations_mapped_to_concrete_work
  - control_files_use_same_phase_and_tranche_vocabulary
- phase_id: PH2
  phase_name: Query Engine seam completion and bounded family delegation
  exit_requires:
  - compiler_query_seam_not_materially_owner_ambiguous
  - covered_family_manifest_exists_and_is_current
  - bounded_family_delegation_is_explicit_and_governed
  - parity_status_exists_by_declared_family_and_surface
  - benchmark_evidence_exists_for_delegated_path
  - compatibility_entrypoint_preserved
  - no_major_doc_implies_repo_wide_full_delegation
- phase_id: PH3
  phase_name: Objective-state promotion
  exit_requires:
  - all_three_objective_states_have_declared_query_surfaces
  - optimizer_does_not_own_canonical_objective_formulas
  - maturity_labels_and_known_gap_statements_are_explicit
  - parity_or_accepted_model_evidence_exists_per_objective_state
  - contributor_trace_expectations_are_defined_for_each_objective_surface
  - phase4_dependency_debt_is_frozen_and_explicit
- phase_id: PH4
  phase_name: Full stat-resolution migration to Query Engine
  exit_requires:
  - canonical_stat_resolution_scope_is_kb_aligned
  - canonical_stat_resolution_scope_resolves_through_qe_owned_paths
  - engine_stat_engine_is_thin_compatibility_only_if_retained
  - engine_stat_resolution_core_owns_no_canonical_stat_logic
  - retained_legacy_files_are_non_canonical_merge_reference_only
  - parity_exists_for_migrated_scope
  - benchmark_evidence_exists_for_migrated_workloads
  - control_docs_and_tests_no_longer_imply_dual_ownership
- phase_id: PH5
  phase_name: Verification, evaluator foundation, and test acceleration
  exit_requires:
  - governed_verification_registries_exist
  - evaluator_inputs_outputs_and_assumptions_are_explicit
  - reference_corpus_exists_for_evaluator_verification
  - evaluator_verification_status_is_visible_by_case_family
  - test_lanes_are_defined_and_ci_policy_matches_them
- phase_id: PH6
  phase_name: run_stats decomposition and thin orchestration
  exit_requires:
  - every_major_remaining_run_stats_concern_has_target_owner
  - extracted_modules_have_clear_ownership
  - run_stats_is_primarily_orchestration
  - outputs_remain_stable_and_validated
- phase_id: PH7
  phase_name: Simulator product surfaces
  exit_requires:
  - simulator_interfaces_are_consistent
  - failure_mode_classification_is_explicit
  - simulator_surfaces_use_governed_lower_layer_truth
  - maturity_and_trust_labels_are_explicit
- phase_id: PH8
  phase_name: Optimiser product surfaces
  exit_requires:
  - optimisers_consume_stable_lower_layer_surfaces
  - objective_families_are_explicit
  - recommendation_confidence_and_trust_logic_are_visible
  - save_vs_spend_branching_is_governed
- phase_id: PH9
  phase_name: Advisor surfaces and external interfaces
  exit_requires:
  - advisor_outputs_consume_governed_lower_layers
  - strategy_explanations_are_traceable
  - external_interfaces_expose_stable_schema
  - trust_labels_remain_explicit
- phase_id: PH10
  phase_name: Archive retirement and cleanup closure
  exit_requires:
  - no_active_work_depends_on_retired_root_artifacts
  - all_retained_truths_are_represented_in_canonical_in_repo_sources
  - repo_docs_point_to_current_truth_not_legacy_bundles
