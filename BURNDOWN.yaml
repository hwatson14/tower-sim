        comparison overlay labels/inputs/counts when present, making CLI/output
        inspection possible without parsing the full matrix artifact. Streamlit
        can now build the same matrix for only the selected tier via the
        existing app-owned tiers argument, preserving all-tier as default while
        making focused Dissonant/IDS debugging much faster. CLI run_stats now
