    required_checks:
      - r86_mapping_review
      - obligation_status_review
    evidence_paths:
      - AI_EXECUTION_PLAN.md
      - R86_CODEX_HANDOFF_GUARDRAILS.md
      - R86_IMPLEMENTATION_SCOPE_AND_ACCEPTANCE.md
      - R86_WORKED_EXAMPLES.md
      - ACTIVE_TRANCHE.md
