      - PH1-TRANCHE-C_R86_OBLIGATION_CLOSURE_LEDGER
      - PH1-TRANCHE-D_ARCHIVE_DISPOSITION_LEDGER
    owner_surfaces:
      - ACTIVE_TRANCHE.md
      - BURNDOWN.yaml
      - AGENTS.md
      - README.md
      - ARCHITECTURE.md
