      - README.md
      - ARCHITECTURE.md
      - ACTIVE_TRANCHE.md
      - BURNDOWN.yaml
    blockers: []
    next_action: Completed; AI_EXECUTION_PLAN.md now absorbs the remaining roadmap-only planning truth and the roadmap artifact can be deleted safely.

  - id: PH1-TRANCHE-C_R86_OBLIGATION_CLOSURE_LEDGER
    title: R86 obligation closure ledger
    phase_id: PH1
    delivery_status: not_started
    verification_status: not_verified
    review_status: draft
    depends_on:
      - PH1-TRANCHE-A_CONTROL_STACK_CLOSEOUT
    owner_surfaces:
