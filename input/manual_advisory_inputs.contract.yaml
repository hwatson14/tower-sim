contract_id: manual_advisory_inputs_v1
purpose: >-
  User-supplied manual inputs required by current calculators, simulators, optimisers,
  or advisors when the value is either not yet query-resolvable or is intentionally
  sourced from an external observation/personal estimate.
required_top_level_fields:
  - inputs
allowed_input_kinds:
  - simplification_assumption
  - external_observation
  - user_rate_estimate
  - accepted_model_override
required_input_fields:
  - input_id
  - input_kind
  - value_type
  - value
  - unit
  - consumer_scope
  - trust_label
  - rationale
  - replacement_target
allowed_value_types:
  - scalar
  - integer
  - pct
  - duration_seconds
  - per_week
  - per_day
  - boolean
trust_labels:
  - user_asserted
  - externally_observed
  - accepted_model
  - policy_heuristic
rules:
  - Manual inputs are Inputs-layer artifacts, not KB mechanic truth.
  - Every manual input must declare which downstream consumer scope may use it.
  - Every manual input must declare a replacement_target describing which future evaluator should obsolete it.
  - Manual inputs must remain explicit and user-editable; do not silently hardcode them into runtime logic.
  - If a consumer requires a manual input and it is absent, the consumer should fail closed or emit a clear missing-input status.
