# input/manual_inputs.yaml
#
# Single canonical manual runtime input file for tower-sim.
# This is the authoritative location for all user-configurable runtime assumptions.
#
# Renamed from: input/assumptions.yaml (backward-compat path stays until T6 app migration)
# Loaded by: input/loader.py
#
# Edit this file to configure loadout, perk policy, manual income observations,
# and ELS scenario inputs. Do not add derived or generated content here.

loadout: {}

# Perk selections: named presets of perk picks. Active preset drives perk materialization.
# Replaces input/perks.json (demoted to archive/legacy/).
perk_config:
  perk_presets: {}
  active_perk_preset: null

perk_policy:
  seed: 42
  target_wave: 50000
  priority_order: []
  first_perk_choice: null
  notes: >-
    Projected max progression perk availability is generated from IDS-backed
    Waves Required / Standard Perk Bonus / Perk Option Quantity / Ban Perks
    plus this policy file. Edit banned_perk_aliases and/or banned_perks here
    to set the default manual bans used by the generator when perk_config above
    has no active preset. Default bans currently: TO3 and TO6.
  banned_perk_aliases:
    - TO3
    - TO6
  banned_perks:
    - "Enemies Have -50% Health, but Tower Health Regen and Lifesteal -90%"
    - "Enemies Speed -40%, But Enemies Damage x2.5"

manual_advisory_inputs:
  inputs:
    - input_id: income.bits.per_week
      input_kind: external_observation
      value_type: per_week
      value: null
      is_set: false
      unit: bits_per_week
      consumer_scope: [simulator, optimizer, advisor]
      trust_label: externally_observed
      rationale: "User-supplied weekly bits income when the repo cannot derive it deterministically."
      replacement_target: "future_query_surface::derived::economy.income.bits"
      notes: "Set is_set=true and provide a numeric value to publish this surface."
    - input_id: income.gems.per_week
      input_kind: external_observation
      value_type: per_week
      value: 4000
      is_set: true
      unit: gems_per_week
      consumer_scope: [simulator, optimizer, advisor]
      trust_label: externally_observed
      rationale: "User-supplied weekly gems income when the repo cannot derive it deterministically."
      replacement_target: "future_query_surface::derived::economy.income.gems"
      notes: "Set is_set=true and provide a numeric value to publish this surface."
    - input_id: income.keys.per_week
      input_kind: external_observation
      value_type: per_week
      value: 0
      is_set: true
      unit: keys_per_week
      consumer_scope: [simulator, optimizer, advisor]
      trust_label: externally_observed
      rationale: "User-supplied weekly keys income when the repo cannot derive it deterministically."
      replacement_target: "future_query_surface::derived::economy.income.keys"
      notes: "Set is_set=true and provide a numeric value to publish this surface."
    - input_id: income.medals.per_week
      input_kind: external_observation
      value_type: per_week
      value: 1000
      is_set: true
      unit: medals_per_week
      consumer_scope: [simulator, optimizer, advisor]
      trust_label: externally_observed
      rationale: "User-supplied weekly medals income when the repo cannot derive it deterministically."
      replacement_target: "future_query_surface::derived::economy.income.medals"
      notes: "Set is_set=true and provide a numeric value to publish this surface."
    - input_id: income.power_stones.per_week
      input_kind: external_observation
      value_type: per_week
      value: 450
      is_set: true
      unit: power_stones_per_week
      consumer_scope: [simulator, optimizer, advisor]
      trust_label: externally_observed
      rationale: "User-supplied weekly power-stones income when the repo cannot derive it deterministically."
      replacement_target: "future_query_surface::derived::economy.income.power_stones"
      notes: "Set is_set=true and provide a numeric value to publish this surface."
    - input_id: module.farming.hours_per_day
      input_kind: accepted_model_parameter
      value_type: scalar
      value: 23.5
      is_set: true
      unit: hours_per_day
      consumer_scope: [simulator, optimizer, advisor]
      trust_label: accepted_model
      rationale: "Average daily farming hours used by the simulator-owned farming throughput model."
      replacement_target: "derived::module.runtime_profile.farming_hours_per_day"
      notes: "Default accepted-model cadence assumption for farming throughput and shard income."

observed_run_els_scenarios:
  scenarios:
    - scenario_id: observed_run_enemy_attack_skip
      scenario_kind: observed_run
      skip_track: enemy_attack_level_skip
      observed_run_label: observed_run_attack_skip_reduction_probe
      enemy_level_skip_reduction_pp: 5.0
      notes: "Prep-only attack-skip observed-run contract for accepted-model ELS helper evaluation."
    - scenario_id: observed_run_enemy_health_skip
      scenario_kind: observed_run
      skip_track: enemy_health_level_skip
      observed_run_label: observed_run_health_skip_reduction_probe
      enemy_level_skip_reduction_pp: 5.0
      notes: "Prep-only health-skip observed-run contract for accepted-model ELS helper evaluation."
