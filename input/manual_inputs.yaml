manual_advisory_inputs:
  inputs:
    - input_id: income.bits.per_week
      input_kind: external_observation
      value_type: per_week
      value: null
      is_set: false
      unit: bits_per_week
      consumer_scope: [simulator, optimizer, advisor]
      trust_label: externally_observed
      rationale: "User-supplied weekly bits income when the repo cannot derive it deterministically."
      replacement_target: "future_query_surface::derived::economy.income.bits"
      notes: "Set is_set=true and provide a numeric value to publish this surface."
    - input_id: income.gems.per_week
      input_kind: external_observation
      value_type: per_week
      value: 4000
      is_set: true
      unit: gems_per_week
      consumer_scope: [simulator, optimizer, advisor]
      trust_label: externally_observed
      rationale: "User-supplied weekly gems income when the repo cannot derive it deterministically."
      replacement_target: "future_query_surface::derived::economy.income.gems"
      notes: "Set is_set=true and provide a numeric value to publish this surface."
    - input_id: income.keys.per_week
      input_kind: external_observation
      value_type: per_week
      value: 0
      is_set: true
      unit: keys_per_week
      consumer_scope: [simulator, optimizer, advisor]
      trust_label: externally_observed
      rationale: "User-supplied weekly keys income when the repo cannot derive it deterministically."
      replacement_target: "future_query_surface::derived::economy.income.keys"
      notes: "Set is_set=true and provide a numeric value to publish this surface."
    - input_id: income.medals.per_week
      input_kind: external_observation
      value_type: per_week
      value: 1000
      is_set: true
      unit: medals_per_week
      consumer_scope: [simulator, optimizer, advisor]
      trust_label: externally_observed
      rationale: "User-supplied weekly medals income when the repo cannot derive it deterministically."
      replacement_target: "future_query_surface::derived::economy.income.medals"
      notes: "Set is_set=true and provide a numeric value to publish this surface."
    - input_id: income.power_stones.per_week
      input_kind: external_observation
      value_type: per_week
      value: 450
      is_set: true
      unit: power_stones_per_week
      consumer_scope: [simulator, optimizer, advisor]
      trust_label: externally_observed
      rationale: "User-supplied weekly power-stones income when the repo cannot derive it deterministically."
      replacement_target: "future_query_surface::derived::economy.income.power_stones"
      notes: "Set is_set=true and provide a numeric value to publish this surface."
    - input_id: module.farming.hours_per_day
      input_kind: accepted_model_parameter
      value_type: scalar
      value: 23.5
      is_set: true
      unit: hours_per_day
      consumer_scope: [simulator, optimizer, advisor]
      trust_label: accepted_model
      rationale: "Average daily farming hours used by the simulator-owned farming throughput model."
      replacement_target: "derived::module.runtime_profile.farming_hours_per_day"
      notes: "Default accepted-model cadence assumption for farming throughput and shard income."
    - input_id: module.project_funding.current_cash
      input_kind: accepted_model_override
      value_type: scalar
      value: 50000000000
      is_set: true
      unit: cash
      consumer_scope: [simulator]
      trust_label: accepted_model
      rationale: "Current-cash runtime assumption used to evaluate Project Funding in projected eDamage."
      replacement_target: "future_query_surface::state::run.current_cash"
      notes: "Project Funding is continuous from current cash; update this value for a different projected run cash point."

