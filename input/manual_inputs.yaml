        - "Spotlight Damage Bonus x1.5"
        - "Chain Lightning Damage x2"
        - "Boss Health -70%, But Boss Speed +50%"
        - "Bounce Shot +2"
      first_perk_choice: "Perk Wave Requirement -20.00%"
