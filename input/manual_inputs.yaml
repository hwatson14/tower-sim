# input/manual_inputs.yaml
#
# Single canonical manual runtime input file for tower-sim.
# This is the authoritative location for all user-configurable runtime assumptions.
#
# Renamed from: input/assumptions.yaml (backward-compat path stays until T6 app migration)
# Loaded by: input/loader.py
#
# Edit this file to configure loadout, perk policy, manual income observations,
# and ELS scenario inputs. Do not add derived or generated content here.

loadout: {}

perk_policy:
  seed: 42
  target_wave: 50000
  priority_order: []
  first_perk_choice: null
  notes: >-
    Projected max progression perk availability is generated from IDS-backed
    Waves Required / Standard Perk Bonus / Perk Option Quantity / Ban Perks
    plus this policy file. Edit banned_perk_aliases and/or banned_perks here
    to set the default manual bans used by the generator when primary perks.json
    has no active preset. Default bans currently: TO3 and TO6.
  banned_perk_aliases:
    - TO3
    - TO6
  banned_perks:
    - "Enemies Have -50% Health, but Tower Health Regen and Lifesteal -90%"
    - "Enemies Speed -40%, But Enemies Damage x2.5"

manual_advisory_inputs:
  inputs:
    - input_id: income.bits.per_week
      input_kind: external_observation
      value_type: per_week
      value: null
      is_set: false
      unit: bits_per_week
      consumer_scope: [simulator, optimizer, advisor]
      trust_label: externally_observed
      rationale: "User-supplied weekly bits income when the repo cannot derive it deterministically."
      replacement_target: "future_query_surface::derived::economy.income.bits"
      notes: "Set is_set=true and provide a numeric value to publish this surface."
