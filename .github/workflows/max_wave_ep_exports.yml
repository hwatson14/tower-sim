name: Max wave vs EP exports

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tower_sim/evaluators/max_wave.py"
      - "tower_sim/loaders/ep_export_loader.py"
      - "tower_sim/run/runner.py"
      - "tests/test_ep_export_fixture.py"
      - "tests/test_max_wave_v1_contract.py"
      - "tests/test_release_gate_tournament_fixtures.py"
      - "tests/fixtures/tower-sim-data/EP_Export.csv"
      - "tests/fixtures/tower-sim-data/manifest.json"
  pull_request:
    paths:
      - "tower_sim/evaluators/max_wave.py"
      - "tower_sim/loaders/ep_export_loader.py"
      - "tower_sim/run/runner.py"
      - "tests/test_ep_export_fixture.py"
      - "tests/test_max_wave_v1_contract.py"
      - "tests/test_release_gate_tournament_fixtures.py"
      - "tests/fixtures/tower-sim-data/EP_Export.csv"
      - "tests/fixtures/tower-sim-data/manifest.json"

jobs:
  validate-max-wave-ep-export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run EP export and max-wave coverage tests
        run: |
          pytest -q \
            tests/test_ep_export_fixture.py \
            tests/test_max_wave_v1_contract.py \
            tests/test_release_gate_tournament_fixtures.py

      - name: Run max-wave runner with fixture IDS/spec
        run: |
          python -m tower_sim.run.runner \
            --ids tests/fixtures/tower-sim-data/_IDS.csv \
            --spec tests/fixtures/specs/sample_spec.yaml \
            --output out/max_wave_ep_exports.json

      - name: Validate runner output schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("out/max_wave_ep_exports.json").read_text(encoding="utf-8"))
          required = {"evaluator", "fail_closed", "missing", "w_max", "diagnostics"}
          missing = required - set(payload)
          if missing:
              raise SystemExit(f"Missing required keys: {sorted(missing)}")
          print("Runner output validated")
          PY

      - name: Upload max-wave artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-wave-ep-exports-output
          path: out/max_wave_ep_exports.json
          if-no-files-found: error
