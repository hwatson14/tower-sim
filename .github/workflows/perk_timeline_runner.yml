name: Perk timeline runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_perk_timeline.py"
      - "tower_sim/engines/perk_timeline_generator.py"
      - "tower_sim/loaders/perk_tables.py"
      - "tests/test_perk_engine.py"
      - "tests/test_perk_tables.py"
      - "tests/fixtures/tower-sim-data/perks_v1.csv"
      - "tests/fixtures/tower-sim-data/perk_pool_weights_v1.csv"
  pull_request:
    paths:
      - "scripts/generate_perk_timeline.py"
      - "tower_sim/engines/perk_timeline_generator.py"
      - "tower_sim/loaders/perk_tables.py"
      - "tests/test_perk_engine.py"
      - "tests/test_perk_tables.py"
      - "tests/fixtures/tower-sim-data/perks_v1.csv"
      - "tests/fixtures/tower-sim-data/perk_pool_weights_v1.csv"

jobs:
  run-perk-timeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run perk timeline unit tests
        run: |
          pytest -q tests/test_perk_engine.py tests/test_perk_tables.py

      - name: Generate perk timeline artifact (smoke)
        run: |
          cat > /tmp/perk_policy.json <<'JSON'
          {
            "seed": 42,
            "target_wave": 1200,
            "waves_required_lab": 0,
            "standard_perk_bonus": 0.0,
            "perk_option_quantity": 0,
            "ban_perks_capacity": 0,
            "banned_perks": [],
            "priority_order": [],
            "first_perk_choice": null
          }
          JSON
          python scripts/generate_perk_timeline.py \
            --policy /tmp/perk_policy.json \
            --out out/perk_timeline/latest.json \
            --diagnostics out/perk_timeline/diagnostics.json

      - name: Validate perk timeline outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          timeline = json.loads(Path("out/perk_timeline/latest.json").read_text(encoding="utf-8"))
          diagnostics = json.loads(Path("out/perk_timeline/diagnostics.json").read_text(encoding="utf-8"))
          if not isinstance(timeline, list):
              raise SystemExit("perk timeline output must be a list")
          required_diag = {"seed", "generated_rows", "final_wave", "perks_taken"}
          missing = required_diag - set(diagnostics)
          if missing:
              raise SystemExit(f"missing diagnostics keys: {sorted(missing)}")
          print("Perk timeline output validated")
          PY

      - name: Upload perk timeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perk-timeline-output
          path: |
            out/perk_timeline/latest.json
            out/perk_timeline/diagnostics.json
          if-no-files-found: error
