name: Wiki Labs Extract (Consolidated)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 18 * * 1" # weekly Monday 18:00 UTC (edit if you want)

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run labs extractor
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python/tools/wiki_ingest/extract_all_labs.py

      - name: Upload consolidated extract artifact
        uses: actions/upload-artifact@v4
        with:
          name: labs_compact_json
          path: data/wiki/extracts/labs_compact.json
          if-no-files-found: error

      - name: Show quick diff (if changed)
        run: |
          git status --porcelain
          git diff --stat || true
