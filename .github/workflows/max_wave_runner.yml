name: Max wave runner

on:
  workflow_dispatch:
    inputs:
      verify_ep_export_parity:
        description: "Run fail-closed EP export max-wave parity target extraction"
        required: false
        default: "false"
  push:
    branches:
      - main
  pull_request:

jobs:
  run-max-wave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run tests
        run: |
          pytest -q

      - name: Run MaxWaveEvaluator runner
        run: |
          python -m tower_sim.run.runner --output runner_output.json

      - name: Validate runner output schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("runner_output.json").read_text(encoding="utf-8"))
          required = {"evaluator", "fail_closed", "missing", "w_max", "diagnostics"}
          missing = required - set(payload.keys())
          if missing:
              raise SystemExit(f"Missing required keys: {sorted(missing)}")
          print("Runner output validated.")
          PY

      - name: Upload runner output artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-wave-runner-output
          path: runner_output.json
          if-no-files-found: error

      - name: Verify EP export max-wave targets (optional, fail-closed when enabled)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_ep_export_parity == 'true' }}
        run: |
          python - <<'PY'
          from tower_sim.loaders.ep_export_loader import (
              extract_max_wave_targets,
              load_ep_export_dataset,
          )

          dataset = load_ep_export_dataset()
          targets = extract_max_wave_targets(dataset)
          print("EP max-wave targets:", dict(targets))
          PY
