name: Max wave runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-max-wave:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run max-wave contract tests
        run: |
          pytest -q \
            tests/test_max_wave_v1_contract.py \
            tests/test_naming_contract.py \
            tests/test_naming_contract_check.py \
            tests/test_max_wave_ep_parity.py \
            tests/test_ep_export_final_stats_parity.py \
            tests/test_release_gate_tournament_fixtures.py

      - name: Validate repository naming contract (fail-closed)
        run: |
          python -m tower_sim.audit.naming_contract_check \
            --ids tests/fixtures/tower-sim-data/_IDS.csv \
            --strict \
            --output out/naming_contract_check.json

      - name: Run MaxWaveEvaluator runner
        run: |
          python -m tower_sim.run.runner --output out/runner_output.json

      - name: Validate runner output schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("out/runner_output.json").read_text(encoding="utf-8"))
          required = {"evaluator", "fail_closed", "missing", "w_max", "diagnostics"}
          missing = required - set(payload.keys())
          if missing:
              raise SystemExit(f"Missing required keys: {sorted(missing)}")
          print("Runner output validated.")
          PY

      - name: Validate runner max-wave against EP export targets
        run: |
          python -m tower_sim.audit.max_wave_ep_parity \
            --runner-output out/runner_output.json \
            --suite ehp \
            --allow-missing-targets

      - name: Compare final stats against EP export rows (ehp/farming)
        run: |
          python -m tower_sim.audit.ep_export_final_stats_parity \
            --ids tests/fixtures/tower-sim-data/_IDS.csv \
            --spec tests/fixtures/specs/sample_spec.yaml \
            --suite ehp \
            --tolerance 0.01 \
            --output out/ep_export_final_stats_report.json

      - name: Promote max-wave outputs to latest artifact names
        run: |
          cp out/runner_output.json out/runner_output_latest.json
          cp out/ep_export_final_stats_report.json out/ep_export_final_stats_report_latest.json

      - name: Upload runner output artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-wave-runner-output
          path: |
            out/runner_output_latest.json
            out/ep_export_final_stats_report_latest.json
          if-no-files-found: error

      - name: Commit latest max-wave artifacts to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add out/runner_output_latest.json out/ep_export_final_stats_report_latest.json
          if git diff --cached --quiet; then
            echo "No max-wave latest artifact changes to commit."
            exit 0
          fi
          git commit -m "Update latest max-wave runner artifacts"
          git push origin HEAD

      - name: Verify EP export max-wave targets (fail-closed)
        run: |
          python - <<'PY'
          from tower_sim.loaders.ep_export_loader import (
              extract_max_wave_targets,
              load_ep_export_dataset,
          )

          dataset = load_ep_export_dataset()
          targets = extract_max_wave_targets(dataset)
          print("EP max-wave targets:", dict(targets))
          PY
