name: Max wave runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-max-wave:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ARTIFACTS_BRANCH: artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run max-wave contract tests
        run: |
          pytest -q \
            tests/test_max_wave_v1_contract.py \
            tests/test_max_wave_ep_parity.py \
            tests/test_ep_export_final_stats_parity.py \
            tests/test_release_gate_tournament_fixtures.py \
            tests/test_max_wave_lineage_contract.py \
            tests/test_naming_contract.py \
            tests/test_naming_contract_check.py

      - name: Validate repository naming contract (fail-closed)
        run: |
          python -m tower_sim.audit.naming_contract_check \
            --ids tests/fixtures/tower-sim-data/_IDS.csv \
            --strict \
            --output out/naming_contract_check.json

      - name: Run MaxWaveEvaluator runner
        run: |
          python -m tower_sim.run.runner \
            --spec "${{ github.workspace }}/fixtures/specs/max_wave.yaml" \
            --ids "${{ github.workspace }}/tests/fixtures/tower-sim-data/_IDS.csv"
      - name: Validate runner output schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("out/max_wave_runner/max_wave_latest.json").read_text(encoding="utf-8"))
          required = {"evaluator", "fail_closed", "missing", "w_max", "diagnostics"}
          missing = required - set(payload.keys())
          if missing:
              raise SystemExit(f"Missing required keys: {sorted(missing)}")
          print("Runner output validated.")
          PY


      - name: Run strict wiring health check
        run: |
          python -m tower_sim.audit.wiring_health_check --strict --max-required-max-wave-gaps 0

      - name: Export lineage full table
        run: |
          python -m tower_sim.audit.stat_lineage_report \
            --manifest out/lineage_manifest_latest.json \
            --full-table-out out/lineage_full_table_latest.json
      - name: Validate runner max-wave against EP export targets
        run: |
          python -m tower_sim.audit.max_wave_ep_parity \
            --runner-output out/max_wave_runner/max_wave_latest.json \
            --suite ehp \
            --allow-missing-targets

      - name: Compare final stats against EP export rows (ehp/farming)
        run: |
          python -m tower_sim.audit.ep_export_final_stats_parity \
            --ids tests/fixtures/tower-sim-data/_IDS.csv \
            --spec tests/fixtures/specs/real_build_pipeline_spec.yaml \
            --suite ehp \
            --compiled-core-only \
            --tolerance 0.01 \
            --output out/ep_export_final_stats_report.json

      - name: Emit stat lineage contract outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from tower_sim.registry.combat_stat_contract import (
              ordered_stat_lineage_sections,
              required_max_wave_stat_input_ids,
              required_combat_stat_ids,
              stat_lineage_manifest,
              stat_lineage_status_lists,
          )

          out_dir = Path("out")
          out_dir.mkdir(parents=True, exist_ok=True)

          manifest = stat_lineage_manifest()
          status_lists = stat_lineage_status_lists()
          section_defs = ordered_stat_lineage_sections()
          ordered_stat_ids = [stat_id for _name, stat_ids in section_defs for stat_id in stat_ids]
          serialized = {
              stat_id: [
                  {
                      "contributor": entry.contributor,
                      "canonical_stat_id": entry.canonical_stat_id,
                      "reaches_stat_input": bool(entry.reaches_stat_input),
                      "exclusion_reason": entry.exclusion_reason,
                  }
                  for entry in manifest[stat_id]
              ]
              for stat_id in ordered_stat_ids
          }
          payload = {
              "schema": "stat_lineage_manifest.v1",
              "stat_count": len(serialized),
              "required_max_wave_stat_input_ids": list(required_max_wave_stat_input_ids()),
              "sections": [
                  {
                      "name": name,
                      "stat_ids": list(stat_ids),
                  }
                  for name, stat_ids in section_defs
              ],
              "required_combat_stat_ids": list(required_combat_stat_ids()),
              "status_lists": {
                  stat_id: {
                      "wired_up": list(status_lists[stat_id].wired_up),
                      "not_expected_to_be_wired_up": list(status_lists[stat_id].not_expected_to_be_wired_up),
                      "still_requires_wiring_up": list(status_lists[stat_id].still_requires_wiring_up),
                  }
                  for stat_id in ordered_stat_ids
              },
              "stats": serialized,
          }
          Path("out/stat_lineage_manifest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=False),
              encoding="utf-8",
          )

          required = set(required_combat_stat_ids())
          reached_required = sorted(
              stat_id
              for stat_id in required
              if any(entry.reaches_stat_input for entry in manifest[stat_id])
          )
          gate = {
              "schema": "stat_lineage_contract_gate.v1",
              "required_count": len(required),
              "reached_required": reached_required,
              "missing_required": sorted(required - set(reached_required)),
              "status": "ok" if required <= set(reached_required) else "fail",
          }
          Path("out/stat_lineage_contract_gate.json").write_text(
              json.dumps(gate, indent=2, sort_keys=True),
              encoding="utf-8",
          )

          if gate["status"] != "ok":
              raise SystemExit(f"Lineage contract gate failed: {gate['missing_required']}")
          print("Wrote out/stat_lineage_manifest.json and out/stat_lineage_contract_gate.json")
          PY

      - name: Upload runner output artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-wave-runner-output
          path: |
            out/max_wave_runner/runner_output_latest.json
            out/max_wave_runner/max_wave_latest.json
          if-no-files-found: error

      - name: Verify EP export max-wave targets (fail-closed)
        run: |
          python - <<'PY'
          from tower_sim.loaders.ep_export_loader import (
              extract_max_wave_targets,
              load_ep_export_dataset,
          )

          dataset = load_ep_export_dataset()
          targets = extract_max_wave_targets(dataset)
          print("EP max-wave targets:", dict(targets))
          PY

      - name: Commit max-wave outputs to artifacts branch
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p /tmp/max-wave-artifacts
          cp out/max_wave_runner/runner_output_latest.json /tmp/max-wave-artifacts/
          cp out/max_wave_runner/max_wave_latest.json /tmp/max-wave-artifacts/

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin "${ARTIFACTS_BRANCH}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${ARTIFACTS_BRANCH}"; then
            git checkout -B "${ARTIFACTS_BRANCH}" "origin/${ARTIFACTS_BRANCH}"
          else
            git checkout --orphan "${ARTIFACTS_BRANCH}"
            git rm -rf . || true
          fi

          mkdir -p out/max_wave_runner
          cp /tmp/max-wave-artifacts/runner_output_latest.json out/max_wave_runner/
          cp /tmp/max-wave-artifacts/max_wave_latest.json out/max_wave_runner/

          git add out/max_wave_runner/runner_output_latest.json out/max_wave_runner/max_wave_latest.json
          if git diff --cached --quiet; then
            echo "No max-wave artifact changes to commit."
            exit 0
          fi
          git commit -m "Update max-wave runner artifacts"
          git push origin "${ARTIFACTS_BRANCH}"
