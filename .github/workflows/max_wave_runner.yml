name: Max wave runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  run-max-wave:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests
        run: |
          pytest -q

      - name: Run MaxWaveEvaluator runner
        run: |
          python -m tower_sim.run.runner > runner_output.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("runner_output.json").read_text(encoding="utf-8"))
          required = {"evaluator", "fail_closed", "missing", "w_max", "diagnostics"}
          missing = required - set(payload.keys())
          if missing:
              raise SystemExit(f"Missing required keys: {sorted(missing)}")
          print("Runner output validated.")
          PY
