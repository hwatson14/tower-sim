name: IDS dump

on:
  workflow_dispatch:
    inputs:
      ids_path:
        description: "Path to _IDS.csv"
        required: false
        default: "tests/fixtures/tower-sim-data/_IDS.csv"
      include_pipeline:
        description: "Emit pipeline stage snapshots (stat inputs, computed stats, optional max-wave)"
        required: false
        default: "true"
      include_run_stats:
        description: "Compute and emit StatEngine run_stats (baseline)"
        required: false
        default: "true"
      include_statbook_rows:
        description: "Emit computed StatEngine statbook rows (filtered; can be large)"
        required: false
        default: "false"
      statbook_allowlist:
        description: "Comma-separated stat_ids for statbook rows (empty = all rows)"
        required: false
        default: ""
      include_max_wave:
        description: "Run MaxWaveEvaluator and emit result+diagnostics"
        required: false
        default: "false"
      problem_spec:
        description: "Optional path to ProblemSpec YAML/JSON (used when include_max_wave=true)"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "**/_IDS.csv"

permissions:
  contents: write

jobs:
  dump-ids:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Dump IDS diagnostics
        run: |
          PYTHONPATH=. python scripts/dump_ids_diagnostics.py \
            --ids-path "${IDS_PATH}" \
            --output-dir out \
            $([ "${INCLUDE_PIPELINE}" = "true" ] && echo "--include-pipeline") \
            $([ "${INCLUDE_RUN_STATS}" = "true" ] && echo "--include-run-stats") \
            $([ "${INCLUDE_STATBOOK_ROWS}" = "true" ] && echo "--include-statbook-rows") \
            $([ -n "${STATBOOK_ALLOWLIST}" ] && echo "--statbook-allowlist ${STATBOOK_ALLOWLIST}") \
            $([ "${INCLUDE_MAX_WAVE}" = "true" ] && echo "--include-max-wave") \
            $([ -n "${PROBLEM_SPEC}" ] && echo "--problem-spec ${PROBLEM_SPEC}")
          cp out/account_snapshot.json out/ids_dump_latest.json
          cp out/base_stats.json out/base_stats_latest.json
          cp out/inventory.json out/inventory_latest.json
          cp out/loadout.json out/loadout_latest.json
          cp out/base_stats_components.json out/base_stats_components_latest.json
          cp out/inventory_components.json out/inventory_components_latest.json
          cp out/run_stats.json out/run_stats_latest.json
          cp out/ids_raw_index.json out/ids_raw_index_latest.json
          cp out/compiled_stat_inputs.json out/compiled_stat_inputs_latest.json
          cp out/stat_engine.json out/stat_engine_latest.json
          cp out/resolved_problem_spec.json out/resolved_problem_spec_latest.json
          cp out/max_wave.json out/max_wave_latest.json
          cp out/stage_1_base_no_respec.json out/stage_1_base_no_respec_latest.json
          cp out/stage_2_base_with_respec.json out/stage_2_base_with_respec_latest.json
          cp out/stage_3_with_loadout.json out/stage_3_with_loadout_latest.json
          cp out/stage_4_with_battle_conditions.json out/stage_4_with_battle_conditions_latest.json
          cp out/stage_5_end_of_run.json out/stage_5_end_of_run_latest.json
          echo "Wrote out/ids_dump_latest.json"
        env:
          IDS_PATH: ${{ inputs.ids_path || 'tests/fixtures/tower-sim-data/_IDS.csv' }}
          INCLUDE_PIPELINE: ${{ inputs.include_pipeline || 'true' }}
          INCLUDE_RUN_STATS: ${{ inputs.include_run_stats || 'true' }}
          INCLUDE_STATBOOK_ROWS: ${{ inputs.include_statbook_rows || 'false' }}
          STATBOOK_ALLOWLIST: ${{ inputs.statbook_allowlist || '' }}
          INCLUDE_MAX_WAVE: ${{ inputs.include_max_wave || 'false' }}
          PROBLEM_SPEC: ${{ inputs.problem_spec || '' }}

      - name: Upload IDS dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: ids-dump
          path: |
            out/account_snapshot.json
            out/account_snapshot.summary.json
            out/base_stats.json
            out/inventory.json
            out/loadout.json
            out/base_stats_components.json
            out/inventory_components.json
            out/run_stats.json
            out/ids_raw_index.json
            out/compiled_stat_inputs.json
            out/stat_engine.json
            out/resolved_problem_spec.json
            out/max_wave.json
            out/stage_1_base_no_respec.json
            out/stage_2_base_with_respec.json
            out/stage_3_with_loadout.json
            out/stage_4_with_battle_conditions.json
            out/stage_5_end_of_run.json
            out/ids_dump_latest.json
            out/base_stats_latest.json
            out/inventory_latest.json
            out/loadout_latest.json
            out/base_stats_components_latest.json
            out/inventory_components_latest.json
            out/run_stats_latest.json
            out/ids_raw_index_latest.json
            out/compiled_stat_inputs_latest.json
            out/stat_engine_latest.json
            out/resolved_problem_spec_latest.json
            out/max_wave_latest.json
            out/stage_1_base_no_respec_latest.json
            out/stage_2_base_with_respec_latest.json
            out/stage_3_with_loadout_latest.json
            out/stage_4_with_battle_conditions_latest.json
            out/stage_5_end_of_run_latest.json
          if-no-files-found: error

      - name: Commit latest IDS dump artifacts to current branch
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add \
            out/account_snapshot.json \
            out/account_snapshot.summary.json \
            out/base_stats.json \
            out/inventory.json \
            out/loadout.json \
            out/base_stats_components.json \
            out/inventory_components.json \
            out/run_stats.json \
            out/ids_raw_index.json \
            out/compiled_stat_inputs.json \
            out/stat_engine.json \
            out/resolved_problem_spec.json \
            out/max_wave.json \
            out/stage_1_base_no_respec.json \
            out/stage_2_base_with_respec.json \
            out/stage_3_with_loadout.json \
            out/stage_4_with_battle_conditions.json \
            out/stage_5_end_of_run.json \
            out/ids_dump_latest.json \
            out/base_stats_latest.json \
            out/inventory_latest.json \
            out/loadout_latest.json \
            out/base_stats_components_latest.json \
            out/inventory_components_latest.json \
            out/run_stats_latest.json \
            out/ids_raw_index_latest.json \
            out/compiled_stat_inputs_latest.json \
            out/stat_engine_latest.json \
            out/resolved_problem_spec_latest.json \
            out/max_wave_latest.json \
            out/stage_1_base_no_respec_latest.json \
            out/stage_2_base_with_respec_latest.json \
            out/stage_3_with_loadout_latest.json \
            out/stage_4_with_battle_conditions_latest.json \
            out/stage_5_end_of_run_latest.json
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi
          git commit -m "Update IDS dump standalone and latest artifacts"
          git push origin HEAD
