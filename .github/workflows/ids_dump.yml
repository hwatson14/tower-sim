name: IDS dump

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to run (branch/sha)"
        required: false
        default: "main"
      ids_path:
        description: "Path to _IDS.csv"
        required: false
        default: "tests/fixtures/tower-sim-data/_IDS.csv"
  push:
    paths:
      - "**/_IDS.csv"

jobs:
  dump-ids:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Dump IDS diagnostics
        run: |
          PYTHONPATH=. python scripts/dump_ids_diagnostics.py \
            --ids-path "${IDS_PATH}" \
            --output-dir audit
          cp audit/account_snapshot.json audit/ids_dump_latest.json
          echo "Wrote audit/ids_dump_latest.json"
        env:
          IDS_PATH: ${{ inputs.ids_path || 'tests/fixtures/tower-sim-data/_IDS.csv' }}

      - name: Upload IDS dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: ids-dump
          path: audit/ids_dump_latest.json
          if-no-files-found: error
