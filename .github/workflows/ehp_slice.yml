name: EHP slice

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to run (branch/sha)"
        required: false
        default: "main"
      allow_out_of_scope:
        description: "Allow out-of-scope sources (cards/perks) instead of failing"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  run-ehp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Compute EHP slice JSON
        env:
          ALLOW_OUT_OF_SCOPE: ${{ inputs.allow_out_of_scope }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tower_sim.loaders.ids_parser import parse_ids
          from tower_sim.evaluators import evaluate_stats

          ids_path = Path("tests/fixtures/tower-sim-data/_IDS.csv")
          ids_state = parse_ids(ids_path)

          enabled = ["tower_hp", "tower_regen", "def_pct", "wall_hp", "wall_regen"]
          allow = (str(Path().joinpath()).__class__)  # no-op to prevent lint paranoia
          allow_out_of_scope = (str(__import__("os").environ.get("ALLOW_OUT_OF_SCOPE","true")).lower() == "true")

          stats = evaluate_stats(ids_state, enabled, allow_out_of_scope=allow_out_of_scope)

          out_dir = Path("outputs/ehp")
          out_dir.mkdir(parents=True, exist_ok=True)
          (out_dir / "latest.json").write_text(json.dumps(stats, indent=2), encoding="utf-8")
          print("Wrote outputs/ehp/latest.json")
          PY

      - name: Publish result to bot-outputs branch
        run: |
          set -euo pipefail

          # Stage outputs somewhere outside the repo so we can safely wipe the working tree
          STAGE="/tmp/ehp_outputs"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/ehp"

          cp "${GITHUB_WORKSPACE}/outputs/ehp/latest.json" "$STAGE/ehp/latest.json"
          ts="$(date -u +'%Y%m%dT%H%M%SZ')"
          cp "$STAGE/ehp/latest.json" "$STAGE/ehp/${ts}.json"

          git config user.name "tower-sim-bot"
          git config user.email "tower-sim-bot@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin bot-outputs >/dev/null 2>&1; then
            git fetch origin bot-outputs
            git switch bot-outputs
          else
            git switch --orphan bot-outputs
          fi

          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p outputs/ehp
          cp "$STAGE/ehp/"*.json outputs/ehp/

          git add outputs/ehp/*.json
          git commit -m "ehp: ${ts} (sha ${GITHUB_SHA})" || echo "No changes to commit"
          git push -f origin bot-outputs
