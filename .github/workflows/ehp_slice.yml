name: EHP slice

on:
  workflow_dispatch:

jobs:
  run-ehp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Evaluate EHP slice
        shell: bash
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          from tower_sim.loaders.ids_parser import parse_ids
          from tower_sim.evaluators import evaluate_stats

          IDS_PATH = Path("tests/fixtures/tower-sim-data/_IDS.csv")
          if not IDS_PATH.exists():
              raise FileNotFoundError(f"IDS file not found: {IDS_PATH}")

          ids_state = parse_ids(IDS_PATH)

          enabled = [
              "tower_hp",
              "tower_regen",
              "def_pct",
              "wall_hp",
              "wall_regen",
          ]

          stats = evaluate_stats(
              ids_state,
              enabled,
              allow_out_of_scope=True,  # flip to False later
          )

          print("EHP_SLICE_JSON=" + json.dumps(stats, indent=2, sort_keys=True))

          Path("ehp_slice.json").write_text(
              json.dumps(stats, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY

      - name: Upload artifact (ehp_slice.json)
        uses: actions/upload-artifact@v4
        with:
          name: ehp-slice
          path: ehp_slice.json
          if-no-files-found: error
