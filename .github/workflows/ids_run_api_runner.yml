name: IDS and run API runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/dump_ids_diagnostics.py"
      - "tower_sim/loaders/ids_parser.py"
      - "tower_sim/loaders/account_snapshot_compiler.py"
      - "tower_sim/run/api.py"
      - "tower_sim/run/runner.py"
      - "tower_sim/run/context.py"
      - "tests/test_dump_ids_diagnostics.py"
      - "tests/test_ids_parser.py"
      - "tests/test_account_snapshot_compiler.py"
      - "tests/test_run_api.py"
      - "tests/test_run_runner.py"
      - "tests/test_run_context.py"
      - "tests/fixtures/tower-sim-data/_IDS.csv"
  pull_request:
    paths:
      - "scripts/dump_ids_diagnostics.py"
      - "tower_sim/loaders/ids_parser.py"
      - "tower_sim/loaders/account_snapshot_compiler.py"
      - "tower_sim/run/api.py"
      - "tower_sim/run/runner.py"
      - "tower_sim/run/context.py"
      - "tests/test_dump_ids_diagnostics.py"
      - "tests/test_ids_parser.py"
      - "tests/test_account_snapshot_compiler.py"
      - "tests/test_run_api.py"
      - "tests/test_run_runner.py"
      - "tests/test_run_context.py"
      - "tests/fixtures/tower-sim-data/_IDS.csv"

jobs:
  run-ids-and-run-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run IDS and run API unit tests
        run: |
          pytest -q \
            tests/test_dump_ids_diagnostics.py \
            tests/test_ids_parser.py \
            tests/test_account_snapshot_compiler.py \
            tests/test_run_api.py \
            tests/test_run_runner.py \
            tests/test_run_context.py

      - name: Run runner smoke output
        run: |
          python -m tower_sim.run.runner --output out/runner_ids_run_api_smoke.json

      - name: Validate runner smoke output schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("out/runner_ids_run_api_smoke.json").read_text(encoding="utf-8"))
          required = {"evaluator", "fail_closed", "missing", "w_max", "diagnostics"}
          missing = required - set(payload)
          if missing:
              raise SystemExit(f"Missing required keys: {sorted(missing)}")
          print("IDS/run API runner output validated")
          PY

      - name: Upload IDS/run API artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ids-run-api-output
          path: out/runner_ids_run_api_smoke.json
          if-no-files-found: error
