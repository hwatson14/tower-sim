output_labels:
  strong_model_coin_bonus:
    strength: strong_model
    surface_ids:
      - support_surface::enhancement.coin_bonus_model_multiplier
      - support_surface::enhancement.coin_bonus_spillover_multiplier
    trust_payload:
      trust_level: strong_model
      runtime_status: runtime_pending
      truth_surface_ids:
        - support_surface::enhancement.coin_bonus_model_multiplier
        - support_surface::enhancement.coin_bonus_spillover_multiplier
      cost_truth_table: kb/workshop/tables/enhancements-values.csv
      value_truth_table: kb/workshop/derived/materialized/wiki-verified-enhancement-coin-bonus.csv
      formula_owner: kb/formulas/tables/canonical-formula-registry.csv
      owner_notes:
        - Strong-model publication is allowed only because the cost and value truth surfaces are pinned to KB-owned sources.
        - Runtime comparator and ROI bundle integration remain deferred beyond this prep tranche.
    provenance_payload:
      kb_surface_paths:
        - kb/workshop/tables/enhancements-values.csv
      materialized_table_paths:
        - kb/workshop/derived/materialized/wiki-verified-enhancement-coin-bonus.csv
      accepted_inputs:
        - input/observed_run_els_scenarios.contract.yaml
      contract_paths:
        - kb/workshop/contracts/enhancement-state-prep.yaml
      notes:
        - Coin Bonus derives from workshop enhancement truth in kb/workshop/tables/ and its materialized row-verified value table.
        - Spillover remains a routed prep surface with value ownership pinned before runtime integration.
  accepted_model_els_helpers:
    strength: accepted_model
    surface_ids:
      - support_surface::enhancement.enemy_attack_level_skip_helper_multiplier
      - support_surface::enhancement.enemy_health_level_skip_helper_multiplier
    trust_payload:
      trust_level: accepted_model
      runtime_status: prep_only
      truth_surface_ids:
        - support_surface::enhancement.enemy_attack_level_skip_helper_multiplier
        - support_surface::enhancement.enemy_health_level_skip_helper_multiplier
      cost_truth_table: kb/workshop/tables/enhancements-values.csv
      value_truth_table: kb/workshop/derived/materialized/wiki-verified-enhancement-enemy-level-skips.csv
      formula_owner: kb/formulas/tables/canonical-formula-registry.csv
      owner_notes:
        - Accepted-model publication is bounded to helper outputs because observed-run scenario deltas are external inputs, not canonical runtime truth.
        - Runtime comparator integration is intentionally deferred in this tranche.
    provenance_payload:
      kb_surface_paths:
        - kb/workshop/tables/enhancements-values.csv
      materialized_table_paths:
        - kb/workshop/derived/materialized/wiki-verified-enhancement-enemy-level-skips.csv
      accepted_inputs:
        - input/observed_run_els_scenarios.contract.yaml
        - input/assumptions.yaml
      contract_paths:
        - kb/workshop/contracts/enhancement-state-prep.yaml
      notes:
        - ELS helper outputs depend on observed-run scenario contracts under input/ and must fail closed if those contracts drift.
        - These helper outputs are prep-only until optimizer/runtime ownership is wired through the future query bundle.
future_query_bundle:
  consumer_id: optimizer_analysis
  bundle_id: optimizer_enhancement_state
  family_bundle_id: optimizer_enhancement_state
  surface_ids:
    - support_surface::enhancement.coin_bonus_model_multiplier
    - support_surface::enhancement.coin_bonus_spillover_multiplier
    - support_surface::enhancement.enemy_attack_level_skip_helper_multiplier
    - support_surface::enhancement.enemy_health_level_skip_helper_multiplier
    - support_surface::free_upgrade_multiplier
  requirements:
    family_scope: progression_v1 only until a dedicated enhancement-state family is declared.
    overlay_policy: Request must remain explicit; no request-all expansion or implicit optional surface widening.
    runtime_owner_status: Optimizer/runtime consumer bundle may consume these surfaces, but run_stats.py must not become the long-term owner.
    resolver_expectation: Bundle must resolve against KB-pinned enhancement tables plus declared observed-run helper inputs only.
    failure_mode: Fail closed on missing truth tables, undeclared surfaces, or missing observed-run contracts.
