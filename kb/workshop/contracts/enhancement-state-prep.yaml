change_classification:
  - Routing correction
  - Output correction
  - Test correction
notes:
  - Non-runtime R94 prep only; this contract does not make run_stats.py the long-term owner.
  - Coin Bonus prep surfaces are intended for strong-model outputs once optimizer-side helper composition lands.
  - ELS helper prep surfaces are accepted-model only until runtime comparator integration is implemented.
