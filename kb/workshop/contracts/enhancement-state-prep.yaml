    cost_table: kb/workshop/tables/enhancements-values.csv
    value_table: kb/workshop/derived/materialized/wiki-verified-enhancement-coin-bonus.csv
    formula_registry_key: enh_coin_bonus_multiplier
    current_value_owner: kb/ledgers/tables/towersim-static-ledger.csv
    current_cost_owner: kb/workshop/tables/enhancements-values.csv
  enemy_attack_level_skip:
