tasks:
  lookup:
    purpose: Find exact values or closed lookup surfaces quickly.
    first_load:
      - START_HERE_FOR_AI.md
      - CHATGPT_KB_PROFILE.yaml
      - KNOWLEDGE_ROLE_SCHEMA.yaml
      - KNOWLEDGE_ROLE_REGISTRY.csv
      - TASK_ENTRYPOINTS.yaml
      - SURFACE_EXECUTION_ORDER.yaml
      - SURFACE_PRIORITY_REGISTRY.csv
      - MASTER_SURFACE_TRUST_LEDGER.csv
      - kb/index.md
    then_use:
      - domain canonical tables
      - domain canonical contracts if a value needs semantic interpretation
      - boundary files if exactness is limited
    avoid:
      - kb/**/derived/**
      - kb/**/sources/raw/**
      - kb/community/**
      - kb/advisory/**
    stop_conditions:
      - if the value is in an accepted boundary or out-of-scope registry, report that status and stop

  mechanics_reasoning:
    purpose: Explain mechanics using approved runtime semantics and package boundaries.
    first_load:
      - START_HERE_FOR_AI.md
      - CHATGPT_KB_PROFILE.yaml
      - KNOWLEDGE_ROLE_SCHEMA.yaml
      - KNOWLEDGE_ROLE_REGISTRY.csv
      - TASK_ENTRYPOINTS.yaml
      - kb/combat/contracts/runtime-ordering-canonical.csv
      - kb/combat/contracts/runtime-damage-pipeline.csv
      - kb/global-rules/contracts/naming-contract.yaml
      - kb/ledgers/tables/simulator-scope-boundary-ledger.csv
    then_use:
      - relevant domain contracts
      - relevant domain canonical tables
      - package-canon and boundary files where applicable
    avoid:
      - community material as mechanics authority
      - advisory notes as mechanics authority

  strategy:
    purpose: Answer build, farming, tournament, and progression questions with grounded strategy support.
    first_load:
      - START_HERE_FOR_AI.md
      - CHATGPT_KB_PROFILE.yaml
      - KNOWLEDGE_ROLE_SCHEMA.yaml
      - KNOWLEDGE_ROLE_REGISTRY.csv
      - TASK_ENTRYPOINTS.yaml
      - kb/advisory/strategy/strategy-index.md
      - kb/advisory/reasoning/reasoning-index.md
      - kb/community/notes/reddit-and-community-meta-layer.md
      - kb/ledgers/tables/simulator-scope-boundary-ledger.csv
    then_use:
      - strategy guidance
      - community signal
      - canonical mechanics to ground or constrain advice
      - accepted boundary files when exact values are unavailable
    avoid:
      - presenting community or strategy advice as hard mechanics canon

  theorycraft:
    purpose: Combine strategy frameworks, community signal, and canonical mechanics for optimization and diagnosis.
    first_load:
      - START_HERE_FOR_AI.md
      - CHATGPT_KB_PROFILE.yaml
      - KNOWLEDGE_ROLE_SCHEMA.yaml
      - KNOWLEDGE_ROLE_REGISTRY.csv
      - kb/advisory/reasoning/reasoning-index.md
      - kb/advisory/strategy/strategy-index.md
      - kb/community/notes/reddit-and-community-meta-layer.md
      - kb/index.md
    then_use:
      - reasoning frameworks
      - strategy guidance
      - community signal
      - canonical mechanics and contracts to constrain claims
