contract_id: module_slot_level_optimizer_r64
status: active
purpose:
  - Evaluate primary-vs-assist upgrade actions for a slot from ranked candidate outputs.
required_candidate_fields:
  - slot_id
  - upgrade_target
  - total_weighted_delta_raw
optional_candidate_fields:
  - resource_cost
  - rank
rules:
  - valid upgrade_target values for this optimizer are primary and assist
  - optimizer may apply cost_weight to compare benefit vs resource cost
  - output must expose best primary, best assist, and final recommended slot action
