contract_id: module_optimizer_overlay_requirements_v1
status: draft_non_runtime_pack14_prep
consumer_id: optimizer_analysis
bundle_id: optimizer_module_effects
allowed_family_ids:
  - progression_start_of_run
  - progression_runtime_no_perks
  - progression_runtime_with_perks
required_overlay_delta_types:
  - module_assertions
optional_overlay_delta_types:
  - assist_slot_choice
forbidden_overlay_delta_types:
  - workshop_mutation
  - runtime_wave_state
  - free_upgrade_runtime_state
requirements:
  - Module optimizer prep may compare equipped module identity and assist-slot selections, but must not mutate live account-state objects in place.
  - Overlay target_scope must stay bounded to declared module optimizer surfaces and/or module contributor_ids once runtime wiring exists.
  - Draft bundle consumers must not request undeclared timing-family support surfaces through the progression family seam.
notes:
  - This draft records the future overlay contract expected by Pack14 optimizer work.
  - It intentionally does not wire live optimizer execution in this tranche.
