schema_revision: 1
kind: environment_parameters
purpose: Contextual modifiers from tier, enemy systems, heat, tournaments, and battle conditions.
notes:
  - These are not permanent tower stats.
  - Keep battle conditions, tier multipliers, and tournament settings isolated here.
  - 'Status meanings: keep_now = source-backed active parameter; retired_synthetic_global = simulator convenience kept only for provenance, not active KB canon; modeled_assumption = explicit assumed value or interpretation.'
