runtime_consumers:
  - node_id: runtime_consumer::wave_progression.attack_wave
    ownership_class: surface
    ownership_status: simulator_owned
    governed_by: runtime_simulation
    downstream_policy: consume_query_owned_surfaces_only
    consumes:
      - state::tower.enemy_attack_level_skip_pct
  - node_id: runtime_consumer::wave_progression.health_wave
    ownership_class: surface
    ownership_status: simulator_owned
    governed_by: runtime_simulation
    downstream_policy: consume_query_owned_surfaces_only
    consumes:
      - state::tower.enemy_health_level_skip_pct
runtime_domains:
  - node_id: runtime_domain::event_ordering
    ownership_class: out_of_scope
    ownership_status: simulator_owned
    governed_by: runtime_simulation
    downstream_policy: simulation_truth_owner
  - node_id: runtime_domain::combat_stepping
    ownership_class: out_of_scope
    ownership_status: simulator_owned
    governed_by: runtime_simulation
    downstream_policy: simulation_truth_owner
analysis_nodes:
  - node_id: analysis_consumer::optimisation_search
    ownership_class: analysis_only
    ownership_status: analysis_only
    governed_by: analysis_reporting
    downstream_policy: may_aggregate_but_not_rederive_truth_owned_surfaces
  - node_id: analysis_consumer::reporting
    ownership_class: analysis_only
    ownership_status: analysis_only
    governed_by: analysis_reporting
    downstream_policy: may_aggregate_but_not_rederive_truth_owned_surfaces
  - node_id: analysis_consumer::diagnostics_synthesis
    ownership_class: analysis_only
    ownership_status: analysis_only
    governed_by: analysis_reporting
    downstream_policy: may_aggregate_but_not_rederive_truth_owned_surfaces
out_of_scope_nodes:
  - node_id: runtime_domain::geometry_migration
    ownership_class: out_of_scope
    ownership_status: out_of_scope
    governed_by: deferred
    downstream_policy: not_query_governed_phase_1
  - node_id: runtime_domain::broad_combat_helpers
    ownership_class: out_of_scope
    ownership_status: out_of_scope
    governed_by: deferred
    downstream_policy: not_query_governed_phase_1
rules:
  - each phase-1 query surface must appear exactly once in surface_nodes
  - governed_by identifies the phase-1 governing owner for the published node, not a permanent conceptual owner across all future layers
  - surface ownership categories must use surface, capability, environment, or context_resource where applicable
  - runtime consumers may consume query-governed nodes but must not re-derive them
  - analysis/reporting may aggregate truth-owned nodes but must not replace their governing owner
