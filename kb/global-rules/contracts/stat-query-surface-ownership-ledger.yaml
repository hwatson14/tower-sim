rules:
- each phase-1 query surface must appear exactly once in surface_nodes
- governed_by identifies the phase-1 governing owner for the published node, not a
  permanent conceptual owner across all future layers
- surface ownership categories must use surface, capability, environment, or context_resource
  where applicable
- runtime consumers may consume query-governed nodes but must not re-derive them
- analysis/reporting may aggregate truth-owned nodes but must not replace their governing
  owner
