schema_revision: 1
kind: domain_coverage
purpose: High-level routing status for KB domains against the live object model.
domains:
  workshop:
    status: strong
    routes_to:
      - canonical_stats
    notes:
      - Base tower stats and utility stats are primarily canonical evaluator-facing values.
  wall:
    status: strong
    routes_to:
      - canonical_stats
      - capabilities
    notes:
      - Wall is treated as a first-class runtime surface, not a mere workshop appendix.
  labs:
    status: moderate
    routes_to:
      - canonical_stats
      - mechanic_params
      - environment_params
    notes:
      - Most labs are contributors rather than destination objects.
  cards:
    status: moderate
    routes_to:
      - canonical_stats
      - capabilities
    notes:
      - Cards mostly contribute to existing tower stats; mechanic-enabling cards also feed capabilities.
  perks:
    status: moderate
    routes_to:
      - canonical_stats
      - mechanic_params
    notes:
      - Tradeoff perks must always split into one row per affected destination.
  modules:
    status: moderate_strong
    routes_to:
      - canonical_stats
      - mechanic_params
    notes:
      - Main and sub-effects are usually contributors; unique effects often require mechanic params.
  ultimate_weapons:
    status: strong
    routes_to:
      - mechanic_params
      - capabilities
    notes:
      - UW upgrades and labs mostly land in mechanic parameters.
  bots:
    status: moderate
    routes_to:
      - mechanic_params
      - capabilities
  guardians:
    status: moderate_strong
    routes_to:
      - mechanic_params
      - capabilities
    notes:
      - Guardian coverage exists but still needed re-verification in an earlier baseline.
  battle_conditions:
    status: strong
    routes_to:
      - environment_params
    notes:
      - BCs are context modifiers, never permanent tower stats.
  tournament_runtime:
    status: moderate
    routes_to:
      - environment_params
  enemies:
    status: moderate
    routes_to:
      - environment_params
    notes:
      - Enemy baselines and scaling are currently represented more strongly in mechanics and quant tables than in the architecture layer.
