schema_revision: 1
kind: account_metadata
purpose: Typed account/system metadata, account flags, cosmetic bonus helpers, and meta progression parameters that are not canonical target stats or mechanic parameters.
notes:
  - Account metadata rows describe imported account state, display settings, unlock flags, and meta progression helpers.
  - Keep mechanic formulas in canonical stat, mechanic, environment, or simulator-owned contracts.
