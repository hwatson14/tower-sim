promotion_review:
  reviewed_nodes:
    - node_id: state::uw.black_hole.cooldown_seconds
      domain: ultimate_weapons
      owner_family_group: timing_v1
      promotion_decision: first_class_surface_entry
      rationale: deterministic timing queries already request the governed Black Hole
        cooldown directly.
    - node_id: state::uw.black_hole.duration_seconds
      domain: ultimate_weapons
      owner_family_group: timing_v1
      promotion_decision: first_class_surface_entry
      rationale: deterministic timing queries already request the governed Black Hole
        duration directly.
    - node_id: state::uw.golden_tower.cooldown_seconds
      domain: ultimate_weapons
      owner_family_group: timing_v1
      promotion_decision: first_class_surface_entry
      rationale: deterministic timing queries already request the governed Golden Tower
        cooldown directly.
    - node_id: state::uw.golden_tower.duration_seconds
      domain: ultimate_weapons
      owner_family_group: timing_v1
      promotion_decision: first_class_surface_entry
      rationale: deterministic timing queries already request the governed Golden Tower
        duration directly.
    - node_id: state::uw.black_hole.base_cooldown_seconds
      domain: ultimate_weapons
      owner_family_group: progression_v1
      promotion_decision: first_class_surface_entry
      rationale: raw owned-state Black Hole cooldown must stay distinct from timing-effective
        cooldown in published queries.
    - node_id: state::uw.black_hole.base_duration_seconds
      domain: ultimate_weapons
      owner_family_group: progression_v1
      promotion_decision: first_class_surface_entry
      rationale: raw owned-state Black Hole duration must stay distinct from timing-effective
        duration in published queries.
    - node_id: state::uw.golden_tower.base_cooldown_seconds
      domain: ultimate_weapons
      owner_family_group: progression_v1
      promotion_decision: first_class_surface_entry
      rationale: raw owned-state Golden Tower cooldown must stay distinct from timing-effective
        cooldown in published queries.
    - node_id: state::uw.golden_tower.base_duration_seconds
      domain: ultimate_weapons
      owner_family_group: progression_v1
      promotion_decision: first_class_surface_entry
      rationale: raw owned-state Golden Tower duration must stay distinct from timing-effective
        duration in published queries.
    - node_id: support_surface::timing.gcomp_cooldown_reduction_seconds
      domain: modules
      owner_family_group: timing_v1
      promotion_decision: first_class_surface_entry
      rationale: Galaxy Compressor unique-effect output is a bounded support dependency
        with direct timing consumers.
    - node_id: state::module.orbital_augment.electron_hits_per_second
      domain: modules
      owner_family_group: none_phase_1
      promotion_decision: helper_debug_only_node
      rationale: Orbital Augment cadence is not intrinsic phase-1 query truth; it is
        owned today by the scenario-runtime input seam in scenario-runtime-inputs.yaml
        via electron_hits_per_second until a sanctioned intrinsic cadence formula exists.
    - node_id: timing.bot_amplify_uptime_fraction
      domain: bots
      owner_family_group: none_phase_1
      promotion_decision: helper_debug_only_node
      rationale: bot uptime remains an internal timing helper and is not a phase-1 query
        contract surface.
    - node_id: timing.bot_golden_uptime_fraction
      domain: bots
      owner_family_group: none_phase_1
      promotion_decision: helper_debug_only_node
      rationale: golden bot uptime remains an internal timing helper and is not a phase-1
        query contract surface.
    - node_id: timing.bot_thunder_uptime_fraction
      domain: bots
      owner_family_group: none_phase_1
      promotion_decision: helper_debug_only_node
      rationale: thunder bot uptime remains an internal timing helper and is not a phase-1
        query contract surface.
    - node_id: guardian_runtime_helpers
      domain: guardians
      owner_family_group: none_phase_1
      promotion_decision: helper_debug_only_node
      rationale: no deterministic guardian timing/progression helper is currently governed
        as a phase-1 query surface.
rules:
- phase 1 excludes geometry surfaces
- phase 1 excludes broad combat-helper surfaces
- expansion beyond this set requires explicit approval
- surface_id values must be unique across the entire phase-1 registry
- references to undeclared surface_id values are invalid and must fail closed
- family-owned surfaces must be declared only in this registry location for phase
  1
- surface categories must use surface, capability, environment, or context_resource
  rather than public/internal splits
