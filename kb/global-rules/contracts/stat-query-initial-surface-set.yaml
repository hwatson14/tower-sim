rules:
- phase 1 excludes geometry surfaces
- phase 1 excludes broad combat-helper surfaces
- expansion beyond this set requires explicit approval
- surface_id values must be unique across the entire phase-1 registry
- references to undeclared surface_id values are invalid and must fail closed
- family-owned surfaces must be declared only in this registry location for phase
  1
- surface categories must use surface, capability, environment, or context_resource
  rather than public/internal splits
