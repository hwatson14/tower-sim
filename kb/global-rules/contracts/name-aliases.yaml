    notes: Use full term in active notes when referring to the reduction mechanic
      rather than the skip system generally.
  object_aliases:
  - alias: Health
    resolves_to_type: canonical_stat
    resolves_to_id: tower_hp
  - alias: Tower Health
    resolves_to_type: canonical_stat
    resolves_to_id: tower_hp
