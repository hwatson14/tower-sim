version: v2
kind: aliases
purpose: Alias registry mapping human-facing names, abbreviations, and legacy labels
  onto canonical KB objects and concepts.
policy:
- Aliases are retrieval aids only.
- Canonical ids and canonical terms win in conflicts.
- Short forms are acceptable in compact notes and tables when listed here.
alias_groups:
  terminology:
  - canonical_term: Enhancements
    aliases:
    - Workshop Plus
    - Workshop Enhancement
    - Workshop Enhancements
    - WS+
    notes: Canonical KB term is Enhancements even when the wiki page title uses Workshop
      Enhancement.
  - canonical_term: Ultimate Weapons
    aliases:
    - UW
    - UWs
  - canonical_term: Ultimate Weapon Plus
    aliases:
    - UW+
  - canonical_term: Battle Conditions
    aliases:
    - BC
    - BCs
  - canonical_term: Effective Paths
    aliases:
    - EP
  ultimate_weapons:
