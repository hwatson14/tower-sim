contract_id: baseline_contributor_map_schema_v1
artifact_type: family_baseline_contributor_map
identity_fields:
  - account_snapshot_id
  - loadout_id
  - scenario_id
  - runtime_branch_id
  - family_id
materialiser_seam:
  phase_1_source: normalized compiler-emitted rows
  phase_1_rule: reuse compiler output rows and normalize them into family-bounded contributor maps
  phase_1_non_goal: full compiler rewrite
surface_scope_rule: only surfaces in the bounded family initial surface set may be emitted in phase 1
row_shape:
  required_fields:
    - surface_id
    - source_class
    - composition_stage
    - contributor_id
    - value
    - value_type
    - active
    - gate_reason
    - provenance_ref
  optional_fields:
    - source_mask
    - unlock_mask
    - equip_mask
    - scenario_activation_mask
source_classes:
  - base
  - workshop
  - labs
  - relics
  - cards
  - modules_main
  - modules_substats
  - ultimate_weapons
  - bots
  - perks
  - scenario_rules
  - battle_conditions
  - heat
  - loadout_mask
  - unlock_mask
composition_stages:
  - base
  - additive_pre_cap
  - multiplicative
  - precedence_override
  - cap_clamp
  - post_cap_modifier
  - gate_enable_disable
  - scenario_adjustment
value_type_examples:
  integer_pct: 33
  scalar: 1.2
  seconds: 13
  count: 4
notes:
  - precedence_override describes declarative data-level precedence, not imperative stat-engine patch logic
