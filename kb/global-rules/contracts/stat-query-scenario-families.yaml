contract_id: stat_query_scenario_families_v1
extends_contracts:
  - scenario-runtime-inputs.yaml
  - state-modes.yaml
family_groups:
  timing:
    families:
      timing_tournament_no_perks:
        state_mode: start_of_run
        mode_id: tournament
        scenario_kind: run
        perks_enabled: false
        baseline_semantics:
          deterministic: true
          immutable: true
          overlay_free: true
          bounded_to_declared_surface_set: true
        allowed_overlay_types:
          - card_assertions
          - module_assertions
          - assist_slot_choice
          - package_event_model
          - runtime_target_display_wave
      timing_farm_with_perks:
        state_mode: start_of_run
        mode_id: farming
        scenario_kind: run
        perks_enabled: true
        baseline_semantics:
          deterministic: true
          immutable: true
          overlay_free: true
          bounded_to_declared_surface_set: true
        allowed_overlay_types:
          - perk_count_overrides
          - card_assertions
          - module_assertions
          - assist_slot_choice
          - package_event_model
          - runtime_target_display_wave
      timing_scenario_probe:
        state_mode: start_of_run
        mode_id: scenario_probe
        scenario_kind: scenario_probe
        perks_enabled: explicit
        baseline_semantics:
          deterministic: true
          immutable: true
          overlay_free: true
          bounded_to_declared_surface_set: true
        allowed_overlay_types:
          - perk_count_overrides
          - card_assertions
          - module_assertions
          - assist_slot_choice
          - package_event_model
          - runtime_target_display_wave
  progression:
    families:
      progression_start_of_run:
        state_mode: start_of_run
        mode_id: progression
        scenario_kind: run
        perks_enabled: false
        baseline_semantics:
          deterministic: true
          immutable: true
          overlay_free: true
          bounded_to_declared_surface_set: true
        allowed_overlay_types:
          - workshop_mutation
          - runtime_wave_state
          - free_upgrade_runtime_state
      progression_runtime_no_perks:
        state_mode: start_of_run
        mode_id: progression
        scenario_kind: run
        perks_enabled: false
        baseline_semantics:
          deterministic: true
          immutable: true
          overlay_free: true
          bounded_to_declared_surface_set: true
        allowed_overlay_types:
          - workshop_mutation
          - runtime_wave_state
          - free_upgrade_runtime_state
      progression_runtime_with_perks:
        state_mode: start_of_run
        mode_id: progression
        scenario_kind: run
        perks_enabled: true
        baseline_semantics:
          deterministic: true
          immutable: true
          overlay_free: true
          bounded_to_declared_surface_set: true
        allowed_overlay_types:
          - workshop_mutation
          - runtime_wave_state
          - free_upgrade_runtime_state
          - perk_count_overrides
rules:
  - families are bounded and named; arbitrary family synthesis is forbidden in phase 1
  - tournament implies perks_enabled=false unless a later governed contract explicitly overrides this
  - family compatibility is asserted against state_mode, mode_id, perks_enabled, and scenario_kind before baseline materialization
  - baseline contributor rows must carry surface_class, domain, source_class, composition_stage, gate_reason, and provenance_ref
