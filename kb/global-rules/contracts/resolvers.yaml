version: v1
kind: resolvers
purpose: Declared combination rules for destination objects.
resolvers:
  - id: standard_scalar_stat
    applies_to:
      - canonical_stat
    description: Sum flat and scalar-compatible contributors in declared order, then apply multiplicative stages.
  - id: pct_capped_scalar_stat
    applies_to:
      - canonical_stat
    description: Resolve scalar percentage contributions and enforce declared caps at the destination object.
  - id: integer_count_stat
    applies_to:
      - canonical_stat
    description: Resolve contributor counts into an integer destination count.
  - id: standard_scalar_param
    applies_to:
      - mechanic_param
    description: Resolve direct mechanic parameters from contributing sources without treating them as general target stats.
  - id: pct_capped_param
    applies_to:
      - mechanic_param
    description: Resolve percentage mechanic params with cap enforcement where applicable.
  - id: uw_duration_param
    applies_to:
      - mechanic_param
    description: Resolve Ultimate Weapon durations from workshop, labs, stones, and contextual reductions.
  - id: cooldown_param
    applies_to:
      - mechanic_param
    description: Resolve cooldown values with direct reductions and floor handling.
  - id: integer_count_param
    applies_to:
      - mechanic_param
    description: Resolve integer mechanic quantities such as spotlight count or effect-wave count.
  - id: environment_scalar
    applies_to:
      - environment_param
    description: Resolve contextual scalar environment values without mixing them into permanent tower stats.
  - id: bc_effective_value
    applies_to:
      - environment_param
    description: Resolve battle-condition values after generic and group reduction rules and exceptions.
  - id: capability_passthrough
    applies_to:
      - capability
    description: Pass boolean or enum capability state into runtime without numeric assembly.
