rules:
- consumer bundles constrain what each bounded consumer may request; they do not redefine
  surface ownership
- family_bundle_id must reference a bundle declared in stat-query-initial-surface-set.yaml
- required_surface_ids and optional_surface_ids must remain subsets of the referenced
  family_bundle_id surface_ids
- bundles fail closed for undeclared consumers, undeclared families, undeclared surfaces,
  and request-all expansion
