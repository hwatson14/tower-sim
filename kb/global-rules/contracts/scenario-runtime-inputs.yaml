fields:
  orb_boss_hit_pct:
    aliases:
      - orb_boss_hit_pct
      - state::combat.orb_boss_hit_pct
    min: 0.0
  orb_boss_hit_count:
    aliases:
      - orb_boss_hit_count
      - orb_boss_hits_total
      - state::combat.orb_boss_hit_count
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Boss Waves v21 replacement TTK uses total orb boss hits while the boss crosses the orb line, not continuous cadence.
  orb_boss_total_damage_pct:
    aliases:
      - orb_boss_total_damage_pct
      - orb_boss_damage_total_pct
      - state::combat.orb_boss_total_damage_pct
    min: 0.0
    max: 100.0
    default: 6.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Boss Waves product path uses total orb damage dealt while the boss crosses the orb line, not continuous cadence.
  electron_hit_count:
    aliases:
      - electron_hit_count
      - electron_hits_total
      - state::combat.electron_hit_count
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Boss Waves v21 replacement TTK uses total electron boss hits, not continuous cadence.
  electron_total_damage_pct:
    aliases:
      - electron_total_damage_pct
      - electron_boss_damage_total_pct
      - state::combat.electron_total_damage_pct
    min: 0.0
    max: 100.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Boss Waves product path uses total electron boss damage, not continuous cadence.
  orb_boss_hits_per_second:
    aliases:
      - orb_boss_hits_per_second
      - state::combat.orb_boss_hits_per_second
    min_exclusive: 0.0
  electron_hits_per_second:
    aliases:
      - electron_hits_per_second
      - state::combat.electron_hits_per_second
    min_exclusive: 0.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Orbital Augment cadence is externally supplied runtime input until a sanctioned intrinsic cadence formula exists.
  boss_time_to_contact_seconds:
    aliases:
      - boss_time_to_contact_seconds
      - state::combat.boss_time_to_contact_seconds
    min: 0.0
    ownership_class: optional_scenario_runtime_override
    owned_by: manual_override_or_boss_waves_contact_time_derivation
    rationale: Boss Waves derives contact time from a 2s base plus owned CF, Energy Net, and Slow Aura effects when this override is omitted.
  boss_hit_interval_seconds:
    aliases:
      - boss_hit_interval_seconds
      - state::combat.boss_hit_interval_seconds
    min: 0.0
  effective_damage_reduction_pct:
    aliases:
      - effective_damage_reduction_pct
      - state::combat.effective_damage_reduction_pct
    min: 0.0
    max: 100.0
  incoming_damage_multiplier:
    aliases:
      - incoming_damage_multiplier
      - state::combat.incoming_damage_multiplier
    min: 0.0
  boss_wave_pressure_factor:
    aliases:
      - boss_wave_pressure_factor
      - boss_wave_difficulty_factor
      - boss_wave_enemy_pressure_factor
      - state::combat.boss_wave_pressure_factor
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Explicit Boss Waves scalar for scenario analysis when non-boss terminal pressure is represented as a simple combined boss-health and incoming-damage pressure factor; omitted by default so it does not become hidden KB truth.
  approve_boss_wave_empirical_pressure_transform:
    aliases:
      - approve_boss_wave_empirical_pressure_transform
      - approve_empirical_boss_pressure_transform
      - state::combat.approve_boss_wave_empirical_pressure_transform
    min: 0.0
    max: 1.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Explicit default-off approval flag for reviewing empirical Boss Waves terminal-pressure transform promotion. A value greater than 0 removes only the operator-approval blocker; it does not apply a hidden pressure factor or close source/validation blockers.
  flame_bot_damage_reduction_pct:
    aliases:
      - flame_bot_damage_reduction_pct
      - state::combat.flame_bot_damage_reduction_pct
    min: 0.0
    max: 100.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Boss Waves uses Flame Bot as a timed DR source when explicit damage-reduction and uptime primitives are provided.
  flame_bot_boss_hit_chance_pct:
    aliases:
      - flame_bot_boss_hit_chance_pct
      - state::combat.flame_bot_boss_hit_chance_pct
    min: 0.0
    max: 100.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Boss Waves average-mode Flame Bot DR uses manual boss-hit chance times Flame Bot DR to produce expected average damage reduction.
  flame_bot_duration_seconds:
    aliases:
      - flame_bot_duration_seconds
      - state::combat.flame_bot_duration_seconds
    min: 0.0
  flame_bot_cooldown_seconds:
    aliases:
      - flame_bot_cooldown_seconds
      - state::combat.flame_bot_cooldown_seconds
    min_exclusive: 0.0
  defense_field_damage_reduction_pct:
    aliases:
      - defense_field_damage_reduction_pct
      - state::combat.defense_field_damage_reduction_pct
    min: 0.0
    max: 100.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Boss Waves uses Defense Field as a timed DR source when explicit damage-reduction and uptime primitives are provided.
  defense_field_duration_seconds:
    aliases:
      - defense_field_duration_seconds
      - state::combat.defense_field_duration_seconds
    min: 0.0
  defense_field_cooldown_seconds:
    aliases:
      - defense_field_cooldown_seconds
      - state::combat.defense_field_cooldown_seconds
    min_exclusive: 0.0
  black_hole_damage_reduction_pct:
    aliases:
      - black_hole_damage_reduction_pct
      - state::combat.black_hole_damage_reduction_pct
    min: 0.0
    max: 100.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Boss Waves uses Black Hole DR only when Plasma Cannon/BH encounter state is explicitly modeled by runtime primitives.
  black_hole_duration_seconds:
    aliases:
      - black_hole_duration_seconds
      - state::combat.black_hole_duration_seconds
    min: 0.0
  black_hole_cooldown_seconds:
    aliases:
      - black_hole_cooldown_seconds
      - state::combat.black_hole_cooldown_seconds
    min_exclusive: 0.0
  pbh_encounter_uptime_fraction:
    aliases:
      - pbh_encounter_uptime_fraction
      - state::combat.pbh_encounter_uptime_fraction
    min: 0.0
    max: 1.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Primordial Black Hole encounter overlap is an explicit Boss Waves runtime state until exact encounter timing is owned by a deeper simulator.
  boss_applicable_damage_per_second:
    aliases:
      - boss_applicable_damage_per_second
      - boss_applicable_dps
      - state::combat.boss_applicable_damage_per_second
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Explicit Boss Waves GC damage bridge when a caller owns a boss-applicable DPS value; omitted by default so the simulator does not hide an unresolved eDamage-to-boss conversion.
  boss_applicable_damage_factor:
    aliases:
      - boss_applicable_damage_factor
      - boss_applicable_edamage_factor
      - gc_boss_applicable_damage_factor
      - state::combat.boss_applicable_damage_factor
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Explicit multiplier from QE-published eDamage into caller-owned boss-applicable DPS for spreadsheet comparison or scenario analysis; omitted by default because Boss Waves now uses the owned EP-to-boss exposure replacement path rather than a hidden workbook calibration.
  boss_edamage_target_share:
    aliases:
      - boss_edamage_target_share
      - boss_target_share
      - gc_boss_edamage_target_share
      - state::combat.boss_edamage_target_share
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Decomposed GC bridge factor for the share of QE-published eDamage actually directed at the boss; all decomposed bridge factors must be supplied together.
  boss_edamage_cadence_uptime_factor:
    aliases:
      - boss_edamage_cadence_uptime_factor
      - boss_damage_cadence_uptime_factor
      - gc_boss_edamage_cadence_uptime_factor
      - state::combat.boss_edamage_cadence_uptime_factor
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Decomposed GC bridge factor for effective cadence and uptime of QE-published eDamage during boss contact; all decomposed bridge factors must be supplied together.
  boss_edamage_reliability_factor:
    aliases:
      - boss_edamage_reliability_factor
      - boss_damage_reliability_factor
      - gc_boss_edamage_reliability_factor
      - state::combat.boss_edamage_reliability_factor
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Decomposed GC bridge factor for shock/reliability or similar effects not otherwise represented in QE eDamage; all decomposed bridge factors must be supplied together.
  boss_edamage_semantic_normalizer:
    aliases:
      - boss_edamage_semantic_normalizer
      - boss_damage_semantic_normalizer
      - gc_boss_edamage_semantic_normalizer
      - state::combat.boss_edamage_semantic_normalizer
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Decomposed GC bridge factor for unit/semantic normalization between QE-published eDamage and boss HP per second; all decomposed bridge factors must be supplied together.
  death_wave_health_max_multiplier:
    aliases:
      - death_wave_health_max_multiplier
      - death_wave_health_multiplier
      - state::combat.death_wave_health_max_multiplier
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Boss Waves Table 1 linearly interpolates Death Wave health from x1 to this max multiplier by death_wave_health_max_wave.
  death_wave_health_max_wave:
    aliases:
      - death_wave_health_max_wave
      - state::combat.death_wave_health_max_wave
    min_exclusive: 0.0
    ownership_class: scenario_runtime_input
    owned_by: manual_or_explicit_runtime_input
    rationale: Boss Waves Table 1 wave by which Death Wave health max multiplier is reached; default product assumption is 1000 when omitted.
  boss_wave_interval:
    aliases:
      - boss_wave_interval
      - state::combat.boss_wave_interval
    min_exclusive: 0.0
  enemy_level_skip_reduction_pp:
    aliases:
      - enemy_level_skip_reduction_pp
      - state::combat.enemy_level_skip_reduction_pp
    min: 0.0
  enemy_level_skip_decay_pct:
    aliases:
      - enemy_level_skip_decay_pct
      - battle_condition__skip_decay__pct
      - state::combat.enemy_level_skip_decay_pct
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: explicit_runtime_input
    rationale: Optional v28 Skip Decay amount override; when omitted, Boss Waves uses the KB-imported battle-condition magnitude curve as the source-owned default.
  enemy_level_skip_decay_interval_waves:
    aliases:
      - enemy_level_skip_decay_interval_waves
      - battle_condition__skip_decay_interval_waves__count
      - state::combat.enemy_level_skip_decay_interval_waves
    min_exclusive: 0.0
    ownership_class: scenario_runtime_input
    owned_by: explicit_runtime_input
    rationale: Optional v28 Skip Decay interval override for constant-step scenario comparisons; when omitted, Boss Waves uses the KB-imported battle-condition magnitude curve.
  enemy_level_skip_decay_start_wave:
    aliases:
      - enemy_level_skip_decay_start_wave
      - state::combat.enemy_level_skip_decay_start_wave
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: explicit_runtime_input_or_scenario_overheat_start_wave
    rationale: Optional override for the wave where v28 Enemy Skip Decay begins; boss-wave projections default to the scenario Overheat start wave when a decay magnitude and interval are supplied.
  tower_damage_decay_pct:
    aliases:
      - tower_damage_decay_pct
      - state::combat.tower_damage_decay_pct
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: explicit_runtime_input
    rationale: v28 tournament Overheat Damage Decay magnitude per 10-wave step; public notes define cadence but not magnitude.
  tower_damage_decay_start_wave:
    aliases:
      - tower_damage_decay_start_wave
      - state::combat.tower_damage_decay_start_wave
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: explicit_runtime_input_or_scenario_overheat_start_wave
    rationale: Optional override for the wave where tournament Damage Decay begins; defaults to scenario Overheat start wave when a magnitude is supplied.
  tower_health_decay_pct:
    aliases:
      - tower_health_decay_pct
      - state::combat.tower_health_decay_pct
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: explicit_runtime_input
    rationale: v28 tournament Overheat Health Decay magnitude per 10-wave step; public notes define cadence but not magnitude.
  tower_health_decay_start_wave:
    aliases:
      - tower_health_decay_start_wave
      - state::combat.tower_health_decay_start_wave
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: explicit_runtime_input_or_scenario_overheat_start_wave
    rationale: Optional override for the wave where tournament Health Decay begins; defaults to scenario Overheat start wave when a magnitude is supplied.
  fleet_terminal_max_wave:
    aliases:
      - fleet_terminal_max_wave
      - state::combat.fleet_terminal_max_wave
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: explicit_runtime_input
    rationale: Explicit maximum surviving wave for fleet/non-boss pressure when externally observed or source-modeled; avoids inventing fleet pressure math.
  elite_terminal_max_wave:
    aliases:
      - elite_terminal_max_wave
      - state::combat.elite_terminal_max_wave
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: explicit_runtime_input
    rationale: Explicit maximum surviving wave for elite/non-boss pressure when externally observed or source-modeled; avoids inventing elite pressure math.
  protector_terminal_max_wave:
    aliases:
      - protector_terminal_max_wave
      - state::combat.protector_terminal_max_wave
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: explicit_runtime_input
    rationale: Explicit maximum surviving wave for protector/control-stall pressure when externally observed or source-modeled; avoids inventing protector pressure math.
  armored_terminal_max_wave:
    aliases:
      - armored_terminal_max_wave
      - state::combat.armored_terminal_max_wave
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: explicit_runtime_input
    rationale: Explicit maximum surviving wave for armored-hit pressure when externally observed or source-modeled; avoids inventing hit-density math.
  boss_terminal_max_wave:
    aliases:
      - boss_terminal_max_wave
      - state::combat.boss_terminal_max_wave
    min: 0.0
    ownership_class: scenario_runtime_input
    owned_by: explicit_runtime_input
    rationale: Explicit maximum surviving wave for boss-specific deferred pressure such as Boss Ultimate when externally observed or source-modeled; avoids inventing Boss Ultimate math.

