contract_id: overlay_delta_schema_v1
artifact_type: immutable_overlay_delta
required_fields:
  - delta_id
  - baseline_runtime_branch_id
  - runtime_branch_id
  - affected_family_id
  - delta_type
  - target_scope
  - changed_contributors
  - changed_masks
  - changed_assertions
allowed_delta_types:
  - workshop_mutation
  - perk_count_overrides
  - card_assertions
  - module_assertions
  - assist_slot_choice
  - package_event_model
  - runtime_target_display_wave
  - runtime_wave_state
  - free_upgrade_runtime_state
branch_lineage_schema:
  required_fields:
    - baseline_runtime_branch_id
    - runtime_branch_id
  rules:
    - baseline_runtime_branch_id must equal the supplied baseline contributor map runtime_branch_id
    - runtime_branch_id must identify a new immutable branch and must not equal baseline_runtime_branch_id
target_scope_schema:
  allowed_keys:
    - surface_ids
    - contributor_ids
    - runtime_consumer_ids
  rules:
    - surface_ids may only reference surfaces already owned by the affected family baseline
    - contributor_ids may only reference contributor rows already owned by the affected family baseline
    - add may target only declared surface_ids; replace, multiply, and remove may target only declared contributor_ids when contributor_ids are supplied
changed_contributors_schema:
  required_fields:
    - contributor_id
  operation_field: operation
  allowed_operations:
    - replace
    - multiply
    - add
    - remove
  per_operation_requirements:
    replace:
      required_fields:
        - contributor_id
        - new_value
      semantics: replace updates only the contributor value payload while preserving baseline identity, source ownership, and metadata
    multiply:
      required_fields:
        - contributor_id
        - factor
      semantics: multiply scales an existing numeric contributor value by factor while preserving baseline identity, source ownership, and metadata
    add:
      required_fields:
        - contributor_id
        - surface_id
        - source_class
        - composition_stage
        - new_value
        - value_type
        - provenance_ref
      semantics: add appends a new contributor row on a declared target surface without mutating or replacing an existing baseline contributor row
    remove:
      required_fields:
        - contributor_id
      semantics: remove drops an existing contributor row identified by contributor_id from the derived branch only
  forbidden_mutations:
    - replace and multiply must not change surface_id
    - replace and multiply must not change surface_class
    - replace and multiply must not change domain
    - replace and multiply must not change source_class
    - replace and multiply must not change composition_stage
    - replace and multiply must not change value_type
    - replace and multiply must not change provenance_ref
    - remove must not carry value or metadata mutation fields
    - add must not overwrite an existing contributor_id
changed_assertions_schema:
  examples:
    - assertion_type: card_assertions
      card_name: Recovery Package Chance
      expected_active: true
    - assertion_type: module_assertions
      module_id: galaxy_compressor
      expected_slot: generator_assist
rules:
  - overlays are immutable branches
  - only dependent surfaces may be dirtied
  - fail closed if family forbids the supplied delta_type
  - vocabulary is pluralized consistently in phase 1: card_assertions, module_assertions
  - overlay deltas may mutate contributor values only through add, remove, replace, and multiply
