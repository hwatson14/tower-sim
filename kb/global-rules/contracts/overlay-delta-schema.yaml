contract_id: overlay_delta_schema_v1
artifact_type: immutable_overlay_delta
required_fields:
  - delta_id
  - runtime_branch_id
  - affected_family_id
  - delta_type
  - target_scope
  - changed_contributors
  - changed_masks
  - changed_assertions
allowed_delta_types:
  - workshop_mutation
  - perk_count_overrides
  - perks_enabled_toggle
  - card_assertions
  - module_assertions
  - assist_slot_choice
  - package_event_model
  - runtime_wave_state
  - scenario_assertions
target_scope_schema:
  allowed_keys:
    - surface_ids
    - contributor_ids
    - runtime_consumer_ids
changed_contributors_schema:
  required_fields:
    - contributor_id
    - new_value
changed_assertions_schema:
  examples:
    - assertion_type: card_assertions
      card_name: Recovery Package Chance
      expected_active: true
    - assertion_type: module_assertions
      module_id: galaxy_compressor
      expected_slot: generator_assist
rules:
  - overlays are immutable branches
  - only dependent surfaces may be dirtied
  - fail closed if family forbids the supplied delta_type
  - vocabulary is pluralized consistently in phase 1: card_assertions, module_assertions
