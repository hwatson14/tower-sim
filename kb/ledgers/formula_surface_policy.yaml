version: 2
policy:
  publish_default: allow_if_resolved
  known_bad_policy: block_publish
  oracle_policy: forbidden_for_publish
  compare_policy: classify_before_counting_mismatch
surfaces:
  state::tower.attack_speed:
    formula_class: generic_validated
    publish_policy: allow
    compare_policy: normal
  state::tower.crit_chance_pct:
    formula_class: generic_validated
    publish_policy: allow
    compare_policy: normalize_percent_scale
    rationale: KB-routed percent surface; compare remains normalized because EP may
      emit decimal fractions.
  state::tower.crit_multiplier:
    formula_class: generic_validated
    publish_policy: allow
    compare_policy: normal
  state::tower.package_chance_pct:
    formula_class: generic_family_promoted
    publish_policy: allow
    compare_policy: normalize_percent_scale
    rationale: KB supports workshop base plus additive package-chance bonuses.
  state::tower.hp:
    formula_class: generic_family_promoted
    publish_policy: allow
    compare_policy: normal
    rationale: Relic health semantics are now explicit in the KB as pct_bonus, matching
      live-wiki guidance that relic bonuses are additive with similar relics and multiplicative
      with other bonuses.
  state::tower.regen:
    formula_class: generic_family_promoted
    publish_policy: allow
    compare_policy: normal
    rationale: Relic health-regen semantics are now explicit in the KB as pct_bonus,
      matching live-wiki guidance that relic bonuses are additive with similar relics
      and multiplicative with other bonuses.
  state::tower.max_rend_multiplier:
    formula_class: kb_contract_repaired
    publish_policy: allow
    compare_policy: normal
    rationale: Exact max-rend formula uses the Rend Armor enhancement multiplier on the 8x base cap, with additive lab bonus and module-substat max-rend percent converted onto the base cap.
  state::tower.defense_pct:
    formula_class: generic_validated
    publish_policy: allow
    compare_policy: normalize_percent_scale
  state::economy.coins_per_kill_bonus:
    formula_class: kb_contract_repaired
    publish_policy: allow
    compare_policy: normal
    rationale: "Coins / Kill display surface: (((workshop x lab) + generator substat sum) x enhancement spillover x (1+vault)) x all-coin perk multipliers. Coin perks are KB-owned on this surface, not on broad all-coin helper surfaces."
  state::economy.coin_bonus_multiplier:
    formula_class: kb_contract_repaired
    publish_policy: allow
    compare_policy: helper_or_non_ep_surface
    rationale: "Broad KB-owned coin surface: direct Coin Bonus enhancement x generator main coin bonus only. Coin perks do not own this surface."
  state::economy.coins_multiplier:
    formula_class: kb_contract_helper_surface
    publish_policy: allow
    compare_policy: helper_or_non_ep_surface
    rationale: "Helper broad-coins multiplier from card and relic rows only; used for composed all-coin display surface."
  state::economy.all_coin_bonus_multiplier:
    formula_class: kb_contract_repaired_derived_display
    publish_policy: allow_if_resolved
    compare_policy: noncomparable_until_oracle
    rationale: "EP-aligned all-coin display surface: coins_per_kill_bonus x coin_bonus_multiplier x coins_multiplier x theme song coin multiplier x parsed account coin multiplier display. Premium flags are traced for audit but not numerically interpreted."
  state::economy.coin_kill_multiplier:
    formula_class: deprecated_transition_mirror
    publish_policy: allow
    compare_policy: normal
    rationale: "Deprecated compatibility mirror of state::economy.coins_per_kill_bonus during transition; must not remain the owner of mixed coin logic."
