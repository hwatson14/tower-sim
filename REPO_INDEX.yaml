  #   test_qe_core.py         -- 13 tests proving qe.* runtime authority (T3B)
  #   test_main_path.py       -- 3 tests proving app/ CLI wiring (T6)
  #   test_simulators_core.py -- 3 tests proving simulators/ layer (T7)
  #   test_evaluators_core.py -- 4 tests proving evaluators/ + advisors/ layer (T7)

  tests/test_tier_progression_account_state.py:
    status: active_candidate
    layer: tests/
    note: T7 -- 1 test quarantined (stale player data); 1 test passes and remains in default gate

  tests/test_lab_advisory_lookup.py:
