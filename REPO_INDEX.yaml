# REPO_INDEX.yaml
#
# Whitelist-rebuild file-status ledger.
# Every non-KB file is classified here.
#
# Status values:
#   active_candidate  — survives in the new active spine
#   archived          — exists only on the separate archive branch
#   generated         — runtime output, not owned by active code
#
# version: 1

# ─── ROOT CONTROL FILES ───────────────────────────────────────────────────────

root:
  README.md:
    status: active_candidate
    layer: root

  ARCHITECTURE.md:
    status: active_candidate
    layer: root

  ACTIVE_TRANCHE.md:
    status: active_candidate
    layer: root

  REPO_INDEX.yaml:
    status: active_candidate
    layer: root

  pyproject.toml:
    status: active_candidate
    layer: root

  requirements.txt:
    status: active_candidate
    layer: root

  .gitignore:
    status: active_candidate
    layer: root

  run_stats.py:
    status: archived
    reason: Monolith distributed to app/, evaluators/, input/, qe/.

# ─── app/ ────────────────────────────────────────────────────────────────────

app:
  app/__init__.py:
    status: active_candidate

  app/display.py:
    status: active_candidate

  app/pipeline.py:
    status: active_candidate
    note: Orchestration authority; utilities sharded in T12.

  app/run_analysis.py:
    status: active_candidate

  app/run_stats.py:
    status: active_candidate
    note: Thin CLI entrypoint.

  app/models.py:
    status: active_candidate
    note: T12 extraction — pipeline dataclasses and trace models.

  app/publication.py:
    status: active_candidate
    note: T12 extraction — artifact writing and trace contract.

# ─── evaluators/ ─────────────────────────────────────────────────────────────

evaluators:
  evaluators/__init__.py:
    status: active_candidate

  evaluators/compare.py:
    status: active_candidate
    note: Thin facade re-exporting sharded logic (T12).

  evaluators/compare_core.py:
    status: active_candidate
    note: T12 shard — core scoring and EP comparison.

  evaluators/audit_engine.py:
    status: active_candidate
    note: T12 shard — publishing gates and KB audits.

  evaluators/residue_analysis.py:
    status: active_candidate
    note: T12 shard — gap analysis and closure reports.

  evaluators/verification_engine.py:
    status: active_candidate
    note: T12 shard — oracle parity and loading logic.

# ─── input/ ───────────────────────────────────────────────────────────────────

input:
  input/*.py:
    status: active_candidate

  input/manual_inputs.yaml:
    status: active_candidate

# ─── qe/ ──────────────────────────────────────────────────────────────────────

qe:
  qe/*.py:
    status: active_candidate

# ─── simulators/ ─────────────────────────────────────────────────────────────

simulators:
  simulators/*.py:
    status: active_candidate

# ─── advisors/ ───────────────────────────────────────────────────────────────

advisors:
  advisors/*.py:
    status: active_candidate

# ─── tests/ ──────────────────────────────────────────────────────────────────

tests:
  tests/*.py:
    status: active_candidate

  tests/app/test_pipeline_functional.py:
    status: active_candidate
    note: T12 functional verification suite.
