# REPO_INDEX.yaml
#
# Whitelist-rebuild file-status ledger.
# Every non-KB file is classified here.
#
# Status values:
#   active_candidate  — survives in the new active spine (may need renaming/moving)
#   archive_candidate — moves to archive/legacy/ once its layer is migrated
#   generated         — runtime output, not owned by active code
#   delete_later      — no value in the new architecture; remove after T8
#
# target: where the logic lands in the new architecture (if active_candidate)

version: 1

# ─── ROOT CONTROL FILES ───────────────────────────────────────────────────────

root:
  README.md:
    status: active_candidate
    layer: root
    note: update to reflect new architecture

  ARCHITECTURE.md:
    status: active_candidate
    layer: root
    note: rewritten for whitelist rebuild (this file's companion)

  ACTIVE_TRANCHE.md:
    status: active_candidate
    layer: root
    note: rewritten for whitelist rebuild tranche cursor

  REPO_INDEX.yaml:
    status: active_candidate
    layer: root
    note: this file; replaces REPO_MAP.yaml

  REPO_MAP.yaml:
    status: delete_later
    reason: superseded by REPO_INDEX.yaml

  pyproject.toml:
    status: active_candidate
    layer: root
    note: package plumbing; update package discovery for new layers

  requirements.txt:
    status: active_candidate
    layer: root

  .gitignore:
    status: active_candidate
    layer: root

  run_stats.py:
    status: archived
    target: archive/legacy/run_stats.py
    reason: >
      142 KB monolith mixing orchestration, domain logic, parsing, display.
      T12: distribution complete. Orchestration in app/, domain in evaluators/, input/, qe/.

  AGENTS.md:
    status: archive_candidate
    target: archive/legacy/AGENTS.md
    reason: old agent governance doc, superseded by new architecture docs

  AI_EXECUTION_PLAN.md:
    status: archive_candidate
    target: archive/legacy/AI_EXECUTION_PLAN.md
    reason: old phase plan (Phase 1–4), superseded by whitelist rebuild tranche plan

  BURNDOWN.yaml:
    status: archive_candidate
    target: archive/legacy/BURNDOWN.yaml
    reason: old burndown format, superseded

