[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tower-sim"
version = "0.1.0"
description = "KB-aligned deterministic simulator and calculator stack for The Tower"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.6",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["engine*", "compilers*", "models*", "parsers*", "optimizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not expensive'"
markers = [
  "slow: subprocess-heavy integration/regression coverage excluded from the default test run",
  "expensive: query-stack parity and completion coverage excluded from the default fast test run",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
