[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tower-sim"
version = "0.1.0"
description = "KB-aligned deterministic simulator and calculator stack for The Tower"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.6",
]
ui = [
  "streamlit>=1.44",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# Active spine packages — post-T13 consolidation (all transitional roots archived)
include = ["qe*", "simulators*", "evaluators*", "advisors*", "app*", "input*"]

[tool.pytest.ini_options]
# Default gate: live architecture spine only.
# Fast, trustworthy, proves the active layer contracts.
# Run manually for broader coverage -- see docs below.
# CI wall-clock budget enforcement for this default gate lives in .github/workflows/ci.yml.
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not quarantine'"
markers = [
  "slow: subprocess-heavy integration/regression coverage excluded from the default test run",
  "expensive: query-stack parity and completion coverage excluded from the default fast test run",
  "quarantine: pre-existing failures or stale coupling to private/data-dependent state; excluded from all gates until fixed",
  "live: primary fast lane tests",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
