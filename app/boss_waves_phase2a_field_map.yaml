    replacement_source: operator_rows.boss_total_damage_taken
    comparability: transformed
    normalization: numeric_display_compact
    required_for: [table]
    cutover_behavior: switch_now
  - product_field: Margin
    consumer_input: boss_survival_margin_hp
    legacy_source: legacy rows.boss_survival_margin_hp
    replacement_source: operator_rows.boss_survival_margin_hp
    comparability: transformed
    normalization: signed_numeric_display_compact
    required_for: [table]
