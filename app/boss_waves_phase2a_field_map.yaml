    required_for: [table]
    cutover_behavior: switch_now
  - product_field: Expected Wall Thorns Dmg %
    consumer_input: boss_expected_wall_thorns_damage_from_hits_pct
    legacy_source: none
    replacement_source: operator_rows.boss_expected_wall_thorns_damage_from_hits_pct
    comparability: not_comparable
    normalization: percent_display
    required_for: [table]
    cutover_behavior: switch_now
    semantic_note: Applied max-HP wall-thorns percent implied by total wall-thorn hits, capped to the remaining boss HP after pre-contact sources; reconciles to Wall Thorns Dmg %.
  - product_field: Wall Thorns Kill (s)
    consumer_input: boss_wall_thorns_contact_kill_seconds
    legacy_source: none
    replacement_source: operator_rows.boss_wall_thorns_contact_kill_seconds
    comparability: not_comparable
    normalization: seconds_display_or_blank
    required_for: [table]
    cutover_behavior: switch_now
  - product_field: Time to Contact (s)
    consumer_input: boss_time_to_contact_seconds
    legacy_source: legacy rows.boss_contact_time_seconds_used
    replacement_source: operator_rows.boss_time_to_contact_seconds
    comparability: equivalent
    normalization: seconds_display
    required_for: [table]
    cutover_behavior: switch_now
  - product_field: Boss Hits
    consumer_input: boss_hits_taken
    legacy_source: legacy rows.boss_hits_taken
    replacement_source: operator_rows.boss_hits_taken
    comparability: transformed
    normalization: integer
    required_for: [table]
    cutover_behavior: switch_now
  - product_field: Hits to Player
    consumer_input: boss_hits_to_player
    legacy_source: none
