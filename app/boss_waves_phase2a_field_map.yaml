artifact: boss_waves_cutover_field_map
schema_version: 1
scope:
  phase: replacement-owned Boss Waves product path
  surfaces:
    table: replacement_sourced
    summary: replacement_sourced
    export: replacement_sourced
    diagnostics: replacement_sourced
  derivation_basis: actual_current_product_consumption_in_app_streamlit_inspector_plus_qe_replacement_input_surfaces
source_selection_owner: app.pipeline.build_boss_wave_payload
renderer_policy: app.streamlit_inspector consumes selected payload fields only
active_replacement_source_id: replacement
backward_compatible_aliases: []
replacement_input_sources:
  owner: app.pipeline assembles inputs only
  mechanics_owner: [qe.run_plan, simulators.evaluator_kernel]
  primitive_resolution_owner: qe.routing.resolve_checkpoint_surfaces
  primitive_layer_policy: QE state::wall.hp carries wall-health ratio contributors; displayed pre-fort Wall HP is derived from QE state::tower.hp times wall-health ratio times non-fort wall-health multipliers before Table 1 row re-derivation, and evaluator TTD applies state::wall.fortification_multiplier exactly once for Wall HP. QE state::wall.regen is a start-of-run wall-regen percent-points primitive and displayed Wall Regen is derived from QE state::tower.regen times state::wall.regen / 100 before Table 1 row re-derivation and Table 2 scenario finalization.
  boss_waves_wall_surface_semantic_contract:
    state::wall.hp:
      exact_source: qe.routing.resolve_checkpoint_surfaces(state::wall.hp)
      semantic_decision: transformed_primitive_not_final_display_value
      primitive_vs_displayed: partial primitive input, not the final displayed Wall HP
      pre_post_fortification: pre-fort wall-health ratio contributor surface; evaluator applies state::wall.fortification_multiplier exactly once to row-derived pre-fort HP for displayed Wall HP
      start_of_run_vs_row_evolved: start-of-run QE primitive feeding Table 1 row re-derivation
      owner_layer: QE publishes source primitive/contributors; app assembles input bundle; qe.run_plan derives row-facing pre-fort HP; simulators.evaluator_kernel finalizes Wall HP
      product_fields: [operator_rows.wall_pre_fort_hp, operator_rows.wall_hp]
      repo_wide_followup: QE rename or split may be considered later, but Boss Waves no longer treats this as final displayed truth
    state::wall.regen:
      exact_source: qe.routing.resolve_checkpoint_surfaces(state::wall.regen)
      semantic_decision: transformed_percent_points_primitive_not_final_hp_per_second
      primitive_vs_displayed: percent-points primitive, not final displayed HP/sec
      pre_post_fortification: not fortification-scaled
      start_of_run_vs_row_evolved: start-of-run QE primitive feeding Table 1 row re-derivation when owned regen state changes
      owner_layer: QE publishes tower_regen and wall_regen percent points; app assembles input bundle; qe.run_plan derives row-facing Wall Regen; simulators.evaluator_kernel applies scenario transforms
      product_fields: [operator_rows.wall_regen]
      repo_wide_followup: QE rename or split may be considered later, but Boss Waves no longer treats this as final displayed truth
  table1_builder: qe.run_plan.build_common_trajectory
  table2_builder: simulators.evaluator_kernel.build_scenario_overlay_table
  legacy_row_engine_dependency_for_default_product_surfaces: none
operator_table_fields:
  - product_field: Wave
    consumer_input: display_wave
    legacy_source: legacy rows.display_wave
    replacement_source: operator_rows.display_wave
    comparability: equivalent
    normalization: integer
    required_for: [table]
    cutover_behavior: switch_now
  - product_field: Atk Wave
    consumer_input: attack_wave
    legacy_source: legacy rows.attack_wave
    replacement_source: operator_rows.attack_wave
    comparability: equivalent
    normalization: integer
    required_for: [table]
    cutover_behavior: switch_now
  - product_field: HP Wave
    consumer_input: health_wave
    legacy_source: legacy rows.health_wave
    replacement_source: operator_rows.health_wave
    comparability: equivalent
    normalization: integer
    required_for: [table]
    cutover_behavior: switch_now
  - product_field: Boss HP
    consumer_input: boss_health
    legacy_source: legacy rows.boss_health
    replacement_source: operator_rows.boss_health
    comparability: transformed
    normalization: numeric_display_compact
    required_for: [table]
    cutover_behavior: switch_now
  - product_field: Boss Atk
    consumer_input: boss_attack
    legacy_source: legacy rows.boss_attack
    replacement_source: operator_rows.boss_attack
    comparability: transformed
    normalization: numeric_display_compact
    required_for: [table]
    cutover_behavior: switch_now
  - product_field: Tower DPS
    consumer_input: tower_damage_per_second
    legacy_source: legacy rows.tower_damage_per_second
    replacement_source: none
    comparability: not_comparable
    normalization: null_display_dash
    required_for: [table]
    cutover_behavior: not_exposed_in_replacement_v21_event_only_ttk
  - product_field: Wall HP
    consumer_input: wall_hp
    legacy_source: legacy rows.wall_pool_hp_used
    replacement_source: operator_rows.wall_hp
    comparability: transformed
    normalization: numeric_display_compact
    required_for: [table]
    cutover_behavior: switch_now
  - product_field: Wall Regen
    consumer_input: wall_regen
    legacy_source: legacy rows.wall_regen
    replacement_source: operator_rows.wall_regen
    comparability: transformed
    normalization: numeric_display_compact
    required_for: [table]
    cutover_behavior: switch_now
  - product_field: Regen Gain
    consumer_input: wall_regen_gained_hp
    legacy_source: legacy rows.wall_regen_gained_hp
    replacement_source: operator_rows.wall_regen_gained_hp
    comparability: transformed
    normalization: numeric_display_compact
    required_for: [table]
    cutover_behavior: switch_now
  - product_field: DR Used
    consumer_input: effective_damage_reduction_pct
    legacy_source: legacy rows.effective_damage_reduction_pct
    replacement_source: operator_rows.effective_damage_reduction_pct
