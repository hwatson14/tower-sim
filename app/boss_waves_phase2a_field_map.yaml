  - product_field: Wall Thorns Dmg %
    consumer_input: boss_wall_thorns_damage_to_boss_pct
    legacy_source: none
    replacement_source: operator_rows.boss_wall_thorns_damage_to_boss_pct
    comparability: not_comparable
