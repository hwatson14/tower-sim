payload_split:
  operator_rows: replacement-backed selected rows for table rendering
  rows: selected rows retained as backward-compatible table alias
  download_rows: replacement-owned export rows for CSV/download
  diagnostics: replacement-owned diagnostics for the active replacement path
export_fields:
  derivation_basis: current product exports download_rows through pandas.DataFrame(...).to_csv(index=False)
  source: download_rows
  replacement_source: app.pipeline.BOSS_WAVE_REPLACEMENT_EXPORT_FIELDS projected from replacement operator rows
  cutover_behavior: switch_now
  row_policy:
    comparability: transformed
    normalization: csv_header_order_matches_BOSS_WAVE_REPLACEMENT_EXPORT_FIELDS
    required_for: [export]
    note: Boss Waves product exports an explicit replacement row surface; legacy rows are not exposed by the product payload.
  replacement_columns:
    - {consumer_input: display_wave, legacy_source: legacy rows.display_wave, replacement_source: download_rows.display_wave, comparability: equivalent, normalization: integer, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: attack_wave, legacy_source: legacy rows.attack_wave, replacement_source: download_rows.attack_wave, comparability: equivalent, normalization: integer, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: health_wave, legacy_source: legacy rows.health_wave, replacement_source: download_rows.health_wave, comparability: equivalent, normalization: integer, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: boss_attack, legacy_source: legacy rows.boss_attack, replacement_source: download_rows.boss_attack, comparability: transformed, normalization: float, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: boss_health, legacy_source: legacy rows.boss_health, replacement_source: download_rows.boss_health, comparability: transformed, normalization: float, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: wall_pre_fort_hp, legacy_source: legacy rows.wall_hp, replacement_source: download_rows.wall_pre_fort_hp, comparability: transformed, normalization: float, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: wall_regen, legacy_source: legacy rows.wall_regen, replacement_source: download_rows.wall_regen, comparability: transformed, normalization: float, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: tower_damage_per_second, legacy_source: legacy rows.tower_damage_per_second, replacement_source: download_rows.tower_damage_per_second, comparability: intentional_semantic_difference, normalization: null_for_v21_event_only_ttk, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: effective_damage_reduction_pct, legacy_source: legacy rows.effective_damage_reduction_pct, replacement_source: download_rows.effective_damage_reduction_pct, comparability: transformed, normalization: percent_float, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: boss_ttk_seconds, legacy_source: legacy rows.boss_ttk_seconds, replacement_source: download_rows.boss_ttk_seconds, comparability: intentional_semantic_difference, normalization: seconds_float_total_v21_event_only, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: boss_plasma_cannon_damage_to_boss_pct, legacy_source: none, replacement_source: download_rows.boss_plasma_cannon_damage_to_boss_pct, comparability: not_comparable, normalization: percent_float, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: boss_orb_damage_to_boss_pct, legacy_source: none, replacement_source: download_rows.boss_orb_damage_to_boss_pct, comparability: not_comparable, normalization: percent_float, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: boss_electron_damage_to_boss_pct, legacy_source: none, replacement_source: download_rows.boss_electron_damage_to_boss_pct, comparability: not_comparable, normalization: percent_float, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: boss_wall_thorns_damage_to_boss_pct, legacy_source: none, replacement_source: download_rows.boss_wall_thorns_damage_to_boss_pct, comparability: not_comparable, normalization: percent_float, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: boss_expected_wall_thorns_damage_from_hits_pct, legacy_source: none, replacement_source: download_rows.boss_expected_wall_thorns_damage_from_hits_pct, comparability: not_comparable, normalization: percent_float, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: boss_wall_thorns_contact_kill_seconds, legacy_source: none, replacement_source: download_rows.boss_wall_thorns_contact_kill_seconds, comparability: not_comparable, normalization: seconds_float_or_null, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: boss_time_to_contact_seconds, legacy_source: legacy rows.boss_contact_time_seconds_used, replacement_source: download_rows.boss_time_to_contact_seconds, comparability: equivalent, normalization: seconds_float_or_null, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: boss_hit_interval_seconds, legacy_source: legacy rows.boss_hit_interval_seconds, replacement_source: download_rows.boss_hit_interval_seconds, comparability: equivalent, normalization: seconds_float, required_surface: export, cutover_behavior: switch_now}
