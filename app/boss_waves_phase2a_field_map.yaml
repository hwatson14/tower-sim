    - {consumer_input: boss_total_damage_taken, legacy_source: legacy rows.boss_total_damage_taken, replacement_source: download_rows.boss_total_damage_taken, comparability: transformed, normalization: float, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: boss_survival_margin_hp, legacy_source: legacy rows.boss_survival_margin_hp, replacement_source: download_rows.boss_survival_margin_hp, comparability: transformed, normalization: float, required_surface: export, cutover_behavior: switch_now}
