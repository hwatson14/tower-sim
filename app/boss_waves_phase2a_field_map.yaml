    - {consumer_input: survives_boss, legacy_source: legacy rows.survives_boss, replacement_source: download_rows.survives_boss, comparability: transformed, normalization: boolean, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: fail_reason, legacy_source: none, replacement_source: download_rows.fail_reason, comparability: not_comparable, normalization: string_or_null, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: replacement_source, legacy_source: none, replacement_source: download_rows.replacement_source, comparability: not_comparable, normalization: string, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: summary_lane_id, legacy_source: none, replacement_source: download_rows.summary_lane_id, comparability: not_comparable, normalization: string, required_surface: export, cutover_behavior: switch_now}
    - {consumer_input: operator_handle_id, legacy_source: none, replacement_source: download_rows.operator_handle_id, comparability: not_comparable, normalization: string, required_surface: export, cutover_behavior: switch_now}
diagnostics_fields:
  derivation_basis: current product constructs the Boss-wave diagnostics expander and summary captions from payload.diagnostics plus payload.summary
  source: diagnostics
  replacement_source: app.pipeline._build_replacement_diagnostics
  cutover_behavior: switch_now
  consumed_fields:
    - consumer_input: diagnostics.preset_name
      normalization: string
      required_for: [diagnostics, summary]
    - consumer_input: diagnostics.mode_id
      normalization: string_or_null
      required_for: [diagnostics]
    - consumer_input: diagnostics.tier_number
