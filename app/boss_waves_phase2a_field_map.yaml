    normalization: seconds_display
    required_for: [table]
    cutover_behavior: switch_now
    semantic_note: Replacement TTK is total v21 event-only boss kill time and includes contact thorns when the boss is not killed before contact.
  - product_field: PC Dmg %
    consumer_input: boss_plasma_cannon_damage_to_boss_pct
    legacy_source: none
    replacement_source: operator_rows.boss_plasma_cannon_damage_to_boss_pct
    comparability: not_comparable
    normalization: percent_display
    required_for: [table]
    cutover_behavior: switch_now
  - product_field: Orb Dmg %
    consumer_input: boss_orb_damage_to_boss_pct
    legacy_source: none
    replacement_source: operator_rows.boss_orb_damage_to_boss_pct
    comparability: not_comparable
    normalization: percent_display
    required_for: [table]
    cutover_behavior: switch_now
  - product_field: Electron Dmg %
    consumer_input: boss_electron_damage_to_boss_pct
    legacy_source: none
